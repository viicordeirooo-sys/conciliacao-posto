<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com wss://*.firebaseio.com; img-src 'self' data:; frame-src 'none'; object-src 'none'; base-uri 'self'"/>
<title>Conciliação — Posto</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080f1a;--card:#0e1c2e;--card2:#112034;--border:#1e3450;
  --text:#e8f4f8;--muted:#4a7a9b;--accent:#f0a500;--accent2:#e8c547;
  --blue:#3fa7d6;--green:#2ecc71;--red:#e74c3c;--pink:#e91e8c;
  --purple:#9b59b6;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --display:'Syne',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;font-size:14px}

/* LOGIN */
#login-screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:1000;
  background-image:radial-gradient(ellipse at 20% 50%, #0a2040 0%, transparent 60%),
                   radial-gradient(ellipse at 80% 20%, #0f1a0a 0%, transparent 50%);
}
.login-box{
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:48px 40px;width:100%;max-width:380px;
  box-shadow:0 0 80px #f0a50010,0 20px 60px #00000080;
}
.login-logo{font-family:var(--display);font-size:13px;font-weight:700;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:32px}
.login-logo span{color:var(--accent)}
.login-title{font-family:var(--display);font-size:28px;font-weight:800;margin-bottom:6px;line-height:1.1}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:32px}
.login-input{
  width:100%;background:#060e1a;border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;color:var(--text);font-size:15px;font-family:var(--mono);
  outline:none;letter-spacing:2px;transition:border-color .2s;
}
.login-input:focus{border-color:var(--accent)}
.login-btn{
  width:100%;margin-top:16px;background:var(--accent);color:#0a0a0a;
  border:none;border-radius:10px;padding:14px;font-family:var(--display);
  font-size:14px;font-weight:700;cursor:pointer;letter-spacing:1px;
  transition:opacity .15s;
}
.login-btn:hover{opacity:.9}
.login-error{margin-top:12px;font-size:12px;color:var(--red);text-align:center;min-height:18px}

/* APP */
#app{display:none}
.header{
  background:linear-gradient(180deg,#0a1628 0%,#080f1a 100%);
  border-bottom:1px solid var(--border);padding:16px 20px 0;
  position:sticky;top:0;z-index:100;
}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.site-name{font-family:var(--display);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:3px;text-transform:uppercase}
.site-name span{color:var(--accent)}
.posto-name{font-family:var(--display);font-size:18px;font-weight:800;line-height:1}
/* Options do seletor de posto: fundo/texto explícitos — o dropdown nativo ignora
   color:inherit e renderiza texto claro sobre fundo claro do SO (invisível). */
#posto-select option{background:var(--card);color:var(--text)}
.posto-sub{font-size:11px;color:var(--muted);margin-top:2px}
.logout-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:11px;cursor:pointer;font-family:var(--font)}
.logout-btn:hover{border-color:var(--muted)}
.tabs{display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{
  padding:10px 18px;border:none;cursor:pointer;font-size:12px;font-weight:600;
  background:transparent;color:var(--muted);border-radius:8px 8px 0 0;
  white-space:nowrap;transition:all .15s;font-family:var(--font);
  border-bottom:2px solid transparent;
}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(240,165,0,.05)}

/* BODY */
.body{padding:20px;max-width:1000px;margin:0 auto}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card-blue{background:#060e1a;border-color:#1e3a5f}
.sec-title{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}

/* STAT CARDS */
.stats-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat-card{background:var(--card);border-radius:12px;padding:14px 16px;flex:1;min-width:90px;border-left:3px solid transparent}
.stat-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.stat-value{font-family:var(--display);font-size:20px;font-weight:800;margin:4px 0 2px;line-height:1}
.stat-sub{font-size:10px;color:var(--muted)}

/* FORM */
.form-grid{display:grid;gap:12px;margin-bottom:14px}
.form-grid-4{grid-template-columns:1fr 1fr 1fr 1fr}
.form-grid-3{grid-template-columns:1fr 1fr 1fr}
.form-grid-2{grid-template-columns:1fr 1fr}
@media(max-width:640px){
  .form-grid-4,.form-grid-3{grid-template-columns:1fr 1fr}
}
@media(max-width:400px){
  .form-grid-4,.form-grid-3,.form-grid-2{grid-template-columns:1fr}
}
label.lbl{font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{
  background:#060e1a;border:1px solid var(--border);border-radius:8px;
  padding:9px 12px;color:var(--text);font-size:13px;width:100%;outline:none;
  font-family:var(--font);transition:border-color .2s;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select{cursor:pointer}
textarea{resize:vertical;font-family:var(--mono);font-size:11px}

/* BUTTONS */
.btn{background:var(--accent);color:#0a0a0a;border:none;border-radius:9px;padding:10px 20px;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font);transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.88}
.btn-dark{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-dark:hover{border-color:var(--muted)}
.btn-sm{background:transparent;color:var(--red);border:1px solid var(--red);border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer;font-family:var(--font)}
.btn-sm:hover{background:#e74c3c20}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}

/* TABLES */
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);letter-spacing:.5px;text-transform:uppercase}
td{padding:9px 12px;border-bottom:1px solid #0e1c2e;vertical-align:middle}
tr:hover td{background:#0a1628}
.table-wrap{overflow-x:auto}

/* BADGES */
.badge{display:inline-block;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;white-space:nowrap}
.badge-ok{background:#0d3320;color:#2ecc71;border:1px solid #2ecc7140}
.badge-div{background:#3a2800;color:#f0a500;border:1px solid #f0a50040}
.badge-late{background:#3a0020;color:#e91e8c;border:1px solid #e91e8c40}
.badge-open{background:#2a0d0d;color:#e74c3c;border:1px solid #e74c3c40}
.badge-due{background:#0a1e30;color:#3fa7d6;border:1px solid #3fa7d640}
.badge-nosale{background:#1a1033;color:#9b59b6;border:1px solid #9b59b640}

/* ALERTS */
.alert-late{background:#1a0010;border:1px solid #e91e8c40;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13px;color:#f48fb1}

/* PILL FILTERS */
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{padding:5px 12px;border-radius:20px;font-size:11px;cursor:pointer;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font);transition:all .15s}
.pill.active{background:var(--accent);color:#0a0a0a;border-color:var(--accent)}

/* PREVIEW BOX */
.preview-box{margin-top:12px;background:#060e1a;border:1px solid var(--border);border-radius:9px;padding:12px 14px;font-size:12px}
.preview-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:6px}
.preview-item{color:var(--muted)}
.preview-item strong{color:var(--text)}

/* MDR BANDEIRAS */
.band-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.band-pill{padding:5px 14px;border-radius:20px;font-size:11px;cursor:pointer;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font)}
.band-pill.active{background:var(--accent);color:#0a0a0a;border-color:var(--accent)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:#00000099;display:flex;align-items:center;justify-content:center;z-index:500;padding:16px}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:520px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}

/* MSG */
.msg-ok{font-size:12px;color:var(--green);margin-top:8px}
.msg-err{font-size:12px;color:var(--red);margin-top:8px}

/* EMPTY */
.empty{text-align:center;color:var(--muted);padding:36px;font-size:13px}

/* TAG FDS */
.tag{display:inline-block;font-size:9px;padding:1px 6px;border-radius:8px;margin-left:5px;font-weight:700}
.tag-fds{background:#0c2a4a;color:var(--blue)}
.tag-fer{background:#2a1a00;color:var(--accent)}
.tag-real{background:#0d3320;color:var(--green)}

/* DRILL-DOWN (detalhe do dia) */
.crow{cursor:pointer}
.crow:hover{background:rgba(240,165,0,.04)}
.caret{color:var(--muted);margin-right:6px;font-size:9px;display:inline-block;width:9px}
.detail-row td{padding:0;background:var(--card2)}
.detail-panel{padding:14px 16px;border-top:2px solid var(--accent)}
.detail-head{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-bottom:12px}
.detail-head strong{color:var(--text)}
.detail-cols{display:flex;gap:16px;flex-wrap:wrap}
.detail-col{flex:1;min-width:240px;background:#060e1a;border:1px solid var(--border);border-radius:9px;padding:10px 12px}
.detail-col h4{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:0 0 8px}
.match-item{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;padding:5px 8px;border-radius:6px;border-left:3px solid transparent;margin-bottom:3px}
.match-item .mi-l{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-item .mi-r{font-weight:600;color:var(--text);white-space:nowrap}
.match-ok{border-left-color:var(--green)}
.match-tol{border-left-color:var(--accent);background:#f0a50014}
.match-orphan-sale{border-left-color:var(--red);background:#e74c3c14}
.match-orphan-bank{border-left-color:var(--purple);background:#9b59b614}
.match-diff{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;background:#3a2800;color:var(--accent);margin-left:6px}
.detail-tot{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--text);border-top:1px solid var(--border);margin-top:6px;padding-top:6px}
.detail-legend{font-size:10px;color:var(--muted);margin-top:10px}
.detail-empty{font-size:11px;color:var(--muted);padding:6px 8px}

/* RESUMO */
.resumo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:500px){.resumo-grid{grid-template-columns:1fr 1fr}}

.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px;animation:pulse 2s infinite}
.sync-dot.saving{background:var(--accent)}
.sync-dot.warn{background:var(--accent);animation:none}
.sync-dot.error{background:var(--red);animation:none}
.posto-sub.error{color:#f48fb1}
.sync-retry{background:none;border:none;color:var(--accent);cursor:pointer;font-size:11px;text-decoration:underline;padding:0;margin-left:6px;font-family:var(--font)}
.access-banner{position:fixed;top:0;left:0;right:0;z-index:9999;background:#3a0010;border-bottom:2px solid var(--red);color:#ffb3c1;padding:12px 16px;text-align:center;font-size:14px;font-weight:600}
.data-banner{position:fixed;top:0;left:0;right:0;z-index:9998;background:#2a2200;border-bottom:2px solid var(--accent);color:#ffe08a;padding:12px 16px;text-align:center;font-size:14px;font-weight:600}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>

<!-- Banner fixo de acesso negado (RBAC): mostrado por showAccessError() -->
<div id="access-banner" class="access-banner" style="display:none"></div>

<!-- Banner âmbar: registros remotos inválidos ignorados (≠ acesso negado) -->
<div id="data-banner" class="data-banner" style="display:none"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">⛽ <span>Conciliação</span> · Posto</div>
    <div class="login-title">Acesso ao sistema</div>
    <div class="login-sub">Digite a senha para continuar</div>
    <input class="login-input" type="email" id="login-email" placeholder="email@exemplo.com" style="margin-bottom:10px;letter-spacing:0" onkeydown="if(event.key==='Enter')doLogin()"/>
    <input class="login-input" type="password" id="login-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="site-name">⛽ <span>Conciliação</span></div>
        <select class="posto-name" id="posto-select" onchange="switchPosto(this.value)" style="background:transparent;border:none;color:inherit;cursor:pointer;padding:0" title="Trocar de posto"></select>
        <div class="posto-sub" id="sync-status"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">Sincronizado com Firebase</span></div>
      </div>
      <button class="logout-btn" onclick="doLogout()">Sair</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('conciliacao',this)">🔍 Conciliação</button>
      <button class="tab-btn" onclick="showTab('vendas',this)">📋 Vendas</button>
      <button class="tab-btn" onclick="showTab('extrato',this)">🏦 Extrato</button>
      <button class="tab-btn" onclick="showTab('resumo',this)">📊 Resumo</button>
      <button class="tab-btn" onclick="showTab('config',this)">⚙️ Config</button>
    </div>
  </div>

  <div class="body">
    <div id="tab-conciliacao"></div>
    <div id="tab-vendas" style="display:none"></div>
    <div id="tab-extrato" style="display:none"></div>
    <div id="tab-resumo" style="display:none"></div>
    <div id="tab-config" style="display:none"></div>
  </div>
</div>

<!-- MODAL CONFIRMAR LIMPAR -->
<div class="modal-overlay" id="confirm-modal" style="display:none">
  <div class="modal-box">
    <div class="modal-header">
      <strong style="color:var(--red)">⚠️ Ação irreversível</strong>
      <button class="modal-close" onclick="closeConfirmModal()">✕</button>
    </div>
    <p id="confirm-msg" style="font-size:13px;color:var(--text);margin-bottom:16px"></p>
    <p style="font-size:12px;color:var(--muted);margin-bottom:8px">Digite <strong style="color:var(--red);letter-spacing:2px">LIMPAR</strong> para confirmar:</p>
    <input type="text" id="confirm-input" placeholder="LIMPAR" autocomplete="off"
      oninput="checkConfirmInput()"
      onkeydown="if(event.key==='Enter')doConfirmAction()"/>
    <div class="btn-row" style="margin-top:16px">
      <button id="confirm-ok-btn" class="btn" style="background:var(--red);opacity:.35;cursor:not-allowed" disabled onclick="doConfirmAction()">Apagar</button>
      <button class="btn btn-dark" onclick="closeConfirmModal()">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL EXPORT -->
<div class="modal-overlay" id="export-modal" style="display:none">
  <div class="modal-box">
    <div class="modal-header">
      <strong>📋 Exportar dados</strong>
      <button class="modal-close" onclick="closeModal('export-modal')">✕</button>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:10px">Copie e envie para outro usuário importar.</p>
    <textarea id="export-text" style="height:180px;width:100%" readonly onclick="this.select()"></textarea>
    <div class="btn-row">
      <button class="btn" onclick="copyExport()">📋 Copiar tudo</button>
      <button class="btn btn-dark" onclick="closeModal('export-modal')">Fechar</button>
    </div>
  </div>
</div>

<!-- MODAL IMPORT -->
<div class="modal-overlay" id="import-modal" style="display:none">
  <div class="modal-box">
    <div class="modal-header">
      <strong>⬆ Importar dados</strong>
      <button class="modal-close" onclick="closeModal('import-modal')">✕</button>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:10px">Cole o texto exportado de outro dispositivo.</p>
    <textarea id="import-text" style="height:160px;width:100%" placeholder='{"sales":[...],"bank":[...],...}'></textarea>
    <div class="btn-row">
      <button class="btn" onclick="doImport()">✅ Importar</button>
      <button class="btn btn-dark" onclick="closeModal('import-modal')">Cancelar</button>
    </div>
    <div id="import-msg"></div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, getDoc, runTransaction, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {

  authDomain: "conciliacao-posto.firebaseapp.com",
  projectId: "conciliacao-posto",

const fbApp = initializeApp(firebaseConfig);

// Role (claim admin/partner) do usuário logado, capturado no onAuthStateChanged.

let _currentRole = null;

// ─── Segurança: Pré-requisitos Firebase ──────────────────────────────────────

// 2. Firebase Console → Authentication → Users → Adicionar usuário:

//    Publicar com:  firebase deploy --only firestore:rules

// ─── Constants ───────────────────────────────────────────────────────────────
// Posto ativo da sessão (multi-posto). Deriva TODOS os docIds do posto (meta/dia).
// Muda em switchPosto; persistido em localStorage. Default até o registry carregar.
let activePosto = "posto1";

const MAX_LOGIN_ATTEMPTS = 5;
const LOCKOUT_MS = 15 * 60 * 1000;
const SESSION_TIMEOUT_MS = 30 * 60 * 1000;

const DEFAULT_HOLIDAYS = [

  "2026-11-02","2026-11-15","2026-11-20","2026-12-25",
  "2027-01-01","2027-02-08","2027-02-09","2027-03-26","2027-04-21",
  "2027-05-01","2027-05-27","2027-09-07","2027-10-12","2027-11-02",
  "2027-11-15","2027-11-20","2027-12-25",
];

const BANDEIRAS = ["Visa","Mastercard","Elo","Hipercard","Amex","VR","VA","Pix","Outro"];
const MODALITIES = [

// ─── Helpers ─────────────────────────────────────────────────────────────────
// Data local (fuso do dispositivo), não UTC: toISOString() viraria o dia
// após ~21h no Brasil (UTC-3) e distorceria status atrasado/a_vencer.
function todays(){
  const d=new Date();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${d.getFullYear()}-${m}-${day}`;
}
function round2(v){ return Math.round((Number(v)+Number.EPSILON)*100)/100; } // 2 casas, meio-pra-cima
// Converte valor de planilha para número. Aceita número JS e texto pt-BR
// ("1.234,56" → 1234.56; "1234,56" → 1234.56; "1.234.567" → 1234567).
function parseBRLNumber(v){
  if(typeof v==="number") return isFinite(v)?v:NaN;
  if(v==null) return NaN;
  let s=String(v).trim().replace(/\s/g,"").replace(/R\$/gi,"");
  if(s==="") return NaN;
  if(s.indexOf(",")>=0){            // vírgula = decimal (pt-BR), ponto = milhar
    s=s.replace(/\./g,"").replace(",",".");
  }else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)){  // milhar sem decimais: 1.234.567
    s=s.replace(/\./g,"");
  }
  const n=Number(s);
  return isFinite(n)?n:NaN;
}
function fmtBRL(v){ return (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function fmtDate(s){ if(!s)return "—"; const[y,m,d]=s.split("-"); return `${d}/${m}/${y}`; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function monthKey(s){ return s?.slice(0,7); }
function monthLabel(k){ if(!k)return ""; const[y,m]=k.split("-"); const n=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"]; return `${n[+m-1]}/${y}`; }
function pct(v){ return (v||0).toFixed(2)+"%" }

// ─── Paginação por DIA — helpers puros ──────────────────────────────────────────
// Modelo de docs do Firestore: um doc de meta (config/mdr/índice de DIAS) +
// um doc por DIA de dados (sales+bank). A partição é por `date` (campo IMUTÁVEL),
// nunca por expectedDate (mutável via recalc/config) — chave de partição estável.
// A granularidade era MENSAL, mas 1 dia real ≈ 129 KB (768 registros) estoura o
// teto de 1 MB por doc no ~dia 8 → migramos para 1 doc por dia (posto1_d_YYYY-MM-DD).
function metaDocId(){ return `${activePosto}_meta`; }
function dayDocId(dia){ return `${activePosto}_d_${dia}`; }
// Dia-partição de um registro = sua DATA (venda feita / dinheiro caído), YYYY-MM-DD.
function partitionDay(rec){ return rec?.date; }
// Quantos dias-calendário anteriores a um mês precisam ser carregados p/ a
// conciliação daquele mês ter TODAS as vendas que liquidam nele. Deriva do MAIOR
// prazo de liquidação: o expectedDate dista no máx. maxGap dias-calendário da date.
// Modalidade "corridos": prazo já é calendário. "Dias úteis": limite superior
// n + 3·ceil(n/5) (2·ceil cobre fins de semana, +1·ceil cobre folga de feriados).
function computeLookbackDays(config){
  let maxGap=0;
  MODALITIES.forEach(m=>{
    const days=config?.liquidation?.[m.name] ?? m.d;
    const corridos=config?.corridos?.[m.name] ?? m.corridos;
    const span=corridos ? days : (days<=0 ? 0 : days + 3*Math.ceil(days/5));
    if(span>maxGap) maxGap=span;
  });
  return maxGap;                                          // dias-calendário; 0 se tudo D+0 (Pix puro)
}
// Dias a carregar para exibir o mês `mes`: todos os dias-doc que EXISTEM no índice
// (daysIndex) dentro da janela [início do mês − lookback … fim do mês]. Filtrar o
// índice (fonte da verdade dos docs existentes) evita ~31 getDocs cegos com miss.
// Strings YYYY-MM-DD comparam cronologicamente. mes+"-31" é limite superior seguro
// (todo dia real do mês é ≤ essa string; dias de meses seguintes são maiores).
function daysOfMonthToLoad(mes){
  const start=addCalendarDays(mes+"-01",-computeLookbackDays(STATE.config)); // início da janela de lookback
  const end=mes+"-31";
  return daysIndex.map(x=>x.dia).filter(d=> d>=start && d<=end ).sort();
}

function escHtml(s){
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ─── Validação de import JSON ───────────────────────────────────────────────────
function isPlainObject(o){ return o!=null && typeof o==="object" && !Array.isArray(o); }
const _DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
// Normaliza/valida uma venda do JSON importado. Lança no 1º problema (fail-fast).
// remote=true (caminho snapshot/load): id inválido LANÇA (será pulado pelo
// sanitizeRemoteList, não auto-corrigido). remote ausente (import): regenera id.
function normSale(s,i,remote){
  if(!isPlainObject(s)) throw new Error(`venda #${i+1}: registro inválido`);
  if(!_DATE_RE.test(s.date)) throw new Error(`venda #${i+1}: data inválida (use AAAA-MM-DD)`);
  if(isNaN(new Date(s.date+"T12:00:00"))) throw new Error(`venda #${i+1}: data inexistente (${s.date})`); // regex só valida formato; 2025-13-99 cai aqui
  const amount=Number(s.amount);
  if(!Number.isFinite(amount)||amount<=0||amount>9999999) throw new Error(`venda #${i+1}: valor inválido`);
  if(!BANDEIRAS.includes(s.bandeira)) throw new Error(`venda #${i+1}: bandeira "${s.bandeira}" desconhecida`);
  if(!MODALITIES.some(m=>m.name===s.modality)) throw new Error(`venda #${i+1}: modalidade "${s.modality}" desconhecida`);
  const idOk=(typeof s.id==="string"&&/^[A-Za-z0-9_-]{1,40}$/.test(s.id));
  if(remote&&!idOk) throw new Error(`venda #${i+1}: id inválido`);
  const out={id:idOk?s.id:uid(),date:s.date,bandeira:s.bandeira,modality:s.modality,amount};
  if(s.extId!=null) out.extId=String(s.extId);
  if(s.liquidoReal!=null){ const lr=Number(s.liquidoReal); if(Number.isFinite(lr)&&lr>=0&&lr<=amount) out.liquidoReal=lr; }
  if(typeof s.expectedDate==="string"&&_DATE_RE.test(s.expectedDate)&&!isNaN(new Date(s.expectedDate+"T12:00:00"))) out.expectedDate=s.expectedDate; // preserva data congelada (round-trip); descarta data impossível → fallback calcDeposit
  if(typeof s.sub==="string"&&(s.sub==="prepago_deb"||s.sub==="prepago_cred")) out.sub=s.sub; // subtipo de liquidação (SafraPay); ausência = débito/crédito/pix normal
  return out;
}
// Normaliza/valida uma entrada bancária do JSON importado.
function normBank(e,i,remote){
  if(!isPlainObject(e)) throw new Error(`entrada #${i+1}: registro inválido`);
  if(!_DATE_RE.test(e.date)) throw new Error(`entrada #${i+1}: data inválida (use AAAA-MM-DD)`);
  if(isNaN(new Date(e.date+"T12:00:00"))) throw new Error(`entrada #${i+1}: data inexistente (${e.date})`);
  const amount=Number(e.amount);
  if(!Number.isFinite(amount)||amount<=0||amount>9999999) throw new Error(`entrada #${i+1}: valor inválido`);
  const idOk=(typeof e.id==="string"&&/^[A-Za-z0-9_-]{1,40}$/.test(e.id));
  if(remote&&!idOk) throw new Error(`entrada #${i+1}: id inválido`);
  const out={id:idOk?e.id:uid(),date:e.date,amount,description:String(e.description||"").trim().slice(0,200)};
  if(e.extId!=null) out.extId=String(e.extId);
  return out;
}

// Caminho REMOTO (snapshot/load): valida cada registro reusando normSale/normBank
// com remote=true. Registro inválido é PULADO (não derruba o lote, não regenera id).
function sanitizeRemoteList(arr,normFn){
  const out=[]; let skipped=0;
  (Array.isArray(arr)?arr:[]).forEach((item,i)=>{
    try{ out.push(normFn(item,i,true)); }
    catch(e){ skipped++; console.warn("[remoto] registro ignorado:",e?.message); }
  });
  return {list:out,skipped};
}

// ─── Clamps de inputs de dinheiro (defesa contra NaN/negativo/absurdo) ───
// window.* porque handlers inline (onchange=) rodam em escopo global e não
// enxergam funções de módulo. Definidas no módulo → ainda veem round2/consts.
window.clampTolerancia=function(v){
  const n=parseFloat(v);
  return Number.isFinite(n)?round2(Math.min(Math.max(n,0),100)):0.05; // [0,100] R$, default 0.05
};
window.clampDiasLiq=function(v,def){
  const n=parseInt(v,10);
  const fb=Number.isFinite(def)?def:1;                                // fallback = m.d da modalidade
  return Number.isFinite(n)?Math.min(Math.max(n,0),90):fb;            // inteiro [0,90]
};
window.clampTaxaMdr=function(v){
  const n=parseFloat(v);
  return Number.isFinite(n)?Math.min(Math.max(n,0),20):0;             // [0,20]%, default 0 (sem round: input usa step 0.001)
};

// Saneia config/mdr remotos DEPOIS do merge, retornando objetos NOVOS (não muta
// DEFAULT_* compartilhado por referência). Defense in depth: valor envenenado
// no doc (NaN/negativo) não entra no STATE nem quebra conciliação/cálculo.
function sanitizeConfig(cfg){
  const liq={};
  MODALITIES.forEach(m=>{ liq[m.name]=clampDiasLiq(cfg.liquidation?.[m.name],m.d); });
  return {...cfg, tolerance:clampTolerancia(cfg.tolerance), liquidation:liq, profile:sanitizeProfile(cfg.profile)};
}
function sanitizeMdr(mdr){
  const out={};
  BANDEIRAS.forEach(b=>{ out[b]={}; MODALITIES.forEach(m=>{ out[b][m.name]=clampTaxaMdr(mdr?.[b]?.[m.name]); }); });
  return out;
}

// Resolve o perfil de conciliação de uma config: usa config.profile (saneado) ou
// o DEFAULT_PROFILE (PagBank). Ponto único p/ os blocos (classificador/matchers)
// obterem o perfil sem repetir fallback. Inerte no commit 1 (ainda ninguém chama).
function profileFor(cfg){ return sanitizeProfile(cfg?.profile); }

// Saneia o perfil DEPOIS do merge (defense in depth, R2): perfil é `map` livre nas
// rules, então um doc envenenado não pode entrar cru no STATE. Cai no DEFAULT_PROFILE
// se ausente/ inválido. NUNCA deixa fallback virar "venda". Objetos NOVOS (não muta
// os DEFAULT_* por referência). Limites sãos (contra payload absurdo).
function sanitizeProfile(p){
  if(!isPlainObject(p)) return DEFAULT_PROFILE;
  const str=(v,max)=>String(v??"").slice(0,max);
  const vParser=PROFILE_PARSERS_VENDAS.includes(p.vendas?.parser)?p.vendas.parser:DEFAULT_PROFILE.vendas.parser;
  const eParsers=(Array.isArray(p.extrato?.parsers)?p.extrato.parsers:[])
    .filter(x=>PROFILE_PARSERS_EXTRATO.includes(x)).slice(0,8);
  const cls=(Array.isArray(p.extrato?.classificacao)?p.extrato.classificacao:[])
    .slice(0,100)
    .map(r=>({
      cat: BANK_CATS.includes(r?.cat)&&r.cat!=="desconhecido" ? r.cat : "nao_venda",
      match:(Array.isArray(r?.match)?r.match:[]).slice(0,50).map(s=>str(s,120)).filter(Boolean),
    }))
    .filter(r=>r.match.length);
  const fb=(p.extrato?.fallback==="nao_venda")?"nao_venda":"desconhecido"; // nunca "venda"
  const modelo=(p.matching?.modelo==="B")?"B":"A";
  const taxaRaw=Number(p.matching?.antecipacao?.taxa);
  const taxa=Number.isFinite(taxaRaw)?Math.min(Math.max(taxaRaw,0),1):(DEFAULT_PROFILE.matching.antecipacao?.taxa??0);
  const cartTolRaw=p.matching?.cartao?.tolerance;
  const cartTol=(cartTolRaw==null)?null:clampTolerancia(cartTolRaw); // null → herda config.tolerance
  // Prazos de liquidação SafraPay por subtipo — só os 5 subtipos conhecidos, cada
  // um {d:[0,90]}. Ausente → o importador cai no fallback de código SAFRA_LIQ.
  const liqIn=isPlainObject(p.vendas?.liquidacao)?p.vendas.liquidacao:null;
  let liq=null;
  if(liqIn){ liq={}; ["debito","prepago_deb","credito","prepago_cred","pix"].forEach(k=>{ if(liqIn[k]!=null) liq[k]={d:clampDiasLiq(liqIn[k]?.d,SAFRA_LIQ[k])}; }); }
  return {
    id:str(p.id,60)||DEFAULT_PROFILE.id,
    label:str(p.label,80)||DEFAULT_PROFILE.label,
    vendas:liq?{ parser:vParser, liquidacao:liq }:{ parser:vParser },
    extrato:{ parsers:eParsers.length?eParsers:[...DEFAULT_PROFILE.extrato.parsers], classificacao:cls, fallback:fb },
    matching:{
      modelo,
      pix:{ chave:(p.matching?.pix?.chave==="liquido")?"liquido":"bruto" },
      cartao:{ chave:(p.matching?.cartao?.chave==="bruto")?"bruto":"liquido", tolerance:cartTol },
      antecipacao:{ taxa },
    },
  };
}

// Perfis embutidos disponíveis no seletor da Config (por posto).
const BUILTIN_PROFILES = [DEFAULT_PROFILE, PROFILE_SAFRA];
// Troca o perfil do posto ATIVO (grava em config.profile). CLONA (não referencia a
// constante compartilhada). É write de config — sem schema/rules. RBAC já restringe.
window.setPostoProfile=function(id){
  const p=BUILTIN_PROFILES.find(x=>x.id===id); if(!p) return;
  STATE.config.profile=JSON.parse(JSON.stringify(p));
  saveToFirebase(); renderCurrentTab();
};

// ─── Rate limiting ────────────────────────────────────────────────────────────
function getLoginState(){
  return{
    attempts:parseInt(localStorage.getItem('_la')||'0'),
    lockuntil:parseInt(localStorage.getItem('_ll')||'0'),
  };
}
function recordLoginFailure(){
  const s=getLoginState();
  const attempts=s.attempts+1;
  localStorage.setItem('_la',attempts);
  if(attempts>=MAX_LOGIN_ATTEMPTS){
    localStorage.setItem('_ll',Date.now()+LOCKOUT_MS);
    localStorage.setItem('_la','0');
  }
}
function clearLoginState(){
  localStorage.removeItem('_la');
  localStorage.removeItem('_ll');
}
function getLockedOutMs(){
  const s=getLoginState();
  if(!s.lockuntil) return 0;
  const remaining=s.lockuntil-Date.now();
  if(remaining<=0){clearLoginState();return 0;}
  return remaining;
}

  sessionTimer=null;
}

function addBusinessDays(dateStr,n,holidays){
  if(n===0)return dateStr;
  const hs=new Set(holidays);
  let d=new Date(dateStr+"T12:00:00"),count=0;
  while(count<n){
    d.setDate(d.getDate()+1);
    const dw=d.getDay(),ds=d.toISOString().slice(0,10);
    if(dw!==0&&dw!==6&&!hs.has(ds))count++;
  }
  return d.toISOString().slice(0,10);
}

function addCalendarDays(dateStr,n){
  if(n===0)return dateStr;
  const d=new Date(dateStr+"T12:00:00");
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

function calcDeposit(dateStr,modality){
  const days=STATE.config.liquidation[modality]??1;
  const corridos=STATE.config.corridos[modality]??false;
  return corridos?addCalendarDays(dateStr,days):addBusinessDays(dateStr,days,STATE.config.holidays);
}

function getMDR(bandeira,modality){
  return (STATE.mdr[bandeira]?.[modality]??0)/100;
}

function enrichSale(s){
  const bruto=Number(s.amount);
  // Data esperada congelada no lançamento prevalece; senão calcula pela config
  // atual (fallback p/ vendas antigas sem o campo — use "Recalcular datas" p/ congelar).
  const expectedDate=(typeof s.expectedDate==="string"&&_DATE_RE.test(s.expectedDate))?s.expectedDate:calcDeposit(s.date,s.modality);
  // Líquido real do extrato prevalece sobre o cálculo pela config (fallback).
  const real=Number(s.liquidoReal);
  let taxa,custoMDR,liquido,taxaSource;
  if(s.liquidoReal!=null&&isFinite(real)&&real>=0&&real<=bruto){
    liquido=real;                       // valor real do extrato (já em centavos)
    custoMDR=round2(bruto-real);
    taxa=bruto>0?custoMDR/bruto:0;
    taxaSource="real";
  }else{
    // Modela a adquirente: arredonda a taxa em centavos, líquido = bruto − taxa.
    taxa=getMDR(s.bandeira,s.modality);
    custoMDR=round2(bruto*taxa);
    liquido=round2(bruto-custoMDR);
    taxaSource="config";
  }
  return {...s,taxa,custoMDR,liquido,bruto,expectedDate,taxaSource};
}

// ── Classificador de lançamentos do extrato (Bloco 1, SÓ-LEITURA) ──────────────
// Categoria derivada da DESCRIÇÃO via profile.extrato.classificacao (ordenada:
// 1ª regra que casa vence). Substring case/acento-insensível (_normHdr nos 2 lados).
// Sem regra → fallback do perfil (nunca "venda"). Rodado na leitura, não persiste
// → retroativo (reclassifica registros já salvos sem reescrever nada).
function classifyBank(desc,profile){
  const d=_normHdr(desc);
  const rules=profile?.extrato?.classificacao||[];
  for(const r of rules){ for(const m of (r.match||[])){ if(m && d.includes(_normHdr(m))) return r.cat; } }
  return profile?.extrato?.fallback||"desconhecido";
}
// Anexa a categoria (análogo a enrichSale). Não muta o registro persistido.
function enrichBank(e,profile){ return {...e,_cat:classifyBank(e.description,profile)}; }
// Entra na conciliação? nao_venda (rendimento, transferências…) e tarifa ficam FORA
// do matching/soma/sem_venda. venda_*/antecipacao/desconhecido seguem elegíveis.
function isBankConciliavel(cat){ return cat!=="nao_venda" && cat!=="tarifa"; }

function getReconciliation(){
  const today=todays();
  const profile=profileFor(STATE.config);
  const enriched=STATE.sales.map(enrichSale);
  const groups={};
  enriched.forEach(s=>{
    const k=s.expectedDate;
    if(!groups[k])groups[k]={date:k,bruto:0,custoMDR:0,liquido:0,sales:[],bandeiras:{}};
    groups[k].bruto+=s.bruto;
    groups[k].custoMDR+=s.custoMDR;
    groups[k].liquido+=s.liquido;
    groups[k].sales.push(s);
    groups[k].bandeiras[s.bandeira]=(groups[k].bandeiras[s.bandeira]||0)+s.bruto;
  });
  const bankByDate={};
  STATE.bank.forEach(e=>{
    if(!isBankConciliavel(classifyBank(e.description,profile))) return; // nao_venda/tarifa fora
    bankByDate[e.date]=(bankByDate[e.date]||0)+Number(e.amount);
  });
  const result=Object.values(groups).map(g=>{
    const actual=bankByDate[g.date]||0;
    const diff=round2(actual-g.liquido); // arredonda p/ remover resíduo de float da soma
    const has=bankByDate[g.date]!==undefined;
    let status;
    if(has){status=Math.abs(diff)<=STATE.config.tolerance?"conciliado":"divergencia";}
    else if(g.date<today){
      const diffDays=Math.floor((new Date(today)-new Date(g.date))/(86400000));
      status=diffDays>=2?"atrasado":"em_aberto";
    }else{status="a_vencer";}
    return {...g,actual,diff,status};
  });
  // Datas que existem só no banco (sem venda prevista) — antes sumiam da
  // conciliação, embora entrassem no total. Agora viram linhas "sem_venda".
  Object.keys(bankByDate).forEach(date=>{
    if(groups[date])return; // já coberta por um grupo de vendas
    const actual=bankByDate[date];
    result.push({date,bruto:0,custoMDR:0,liquido:0,sales:[],bandeiras:{},actual,diff:actual,status:"sem_venda"});
  });
  return result.sort((a,b)=>b.date.localeCompare(a.date));
}

// ─── Firebase ─────────────────────────────────────────────────────────────────
// Merge 3-vias por id: parte do remoto, remove o que foi deletado localmente
// (estava no baseline e sumiu do local) e aplica os itens locais (add/edit vence).
// Garante que adds concorrentes de A e B sobrevivam e que deleções sejam respeitadas.
function mergeListById(remoteList,localList,baselineIds){
  const map=new Map((remoteList||[]).map(x=>[x.id,x]));
  const localIds=new Set((localList||[]).map(x=>x.id));
  baselineIds.forEach(id=>{ if(!localIds.has(id)) map.delete(id); });
  (localList||[]).forEach(x=>map.set(x.id,x));
  return [...map.values()];
}

// ── Registry de postos (multi-posto) ────────────────────────────────────────────
const REGISTRY_ID="postos_registry";
const LS_ACTIVE_POSTO="cp_active_posto";
function loadSavedPosto(){ try{ return localStorage.getItem(LS_ACTIVE_POSTO)||""; }catch(e){ return ""; } }
function saveActivePosto(id){ try{ localStorage.setItem(LS_ACTIVE_POSTO,id); }catch(e){} }
// Posto ativo = último salvo (se ainda existe no registry) senão o 1º do registry.
function resolveActivePosto(){
  const saved=loadSavedPosto();
  if(saved && postosRegistry.some(p=>p.id===saved)) return saved;
  return postosRegistry.length ? postosRegistry[0].id : "posto1";
}
// Carrega o registry em `postosRegistry`. BOOTSTRAP: se não existir (ou vier vazio),
// cria com o posto1 atual — numa tx (get→set) p/ não clobberar se outra aba criou
// concorrentemente. Idempotente. Chamado no boot antes de escolher o posto ativo.
async function ensureRegistry(){
  const ref=doc(db,"conciliacao",REGISTRY_ID);
  const snap=await getDoc(ref);
  if(snap.exists() && Array.isArray(snap.data().postos) && snap.data().postos.length){
    postosRegistry=snap.data().postos;
    return postosRegistry;
  }
  let created=null, didCreate=false;
  await runTransaction(db,async(tx)=>{
    const s=await tx.get(ref);
    if(s.exists() && Array.isArray(s.data().postos) && s.data().postos.length){ created=s.data().postos; didCreate=false; return; }
    created=[{id:"posto1",nome:"Posto 1"}];
    tx.set(ref,{postos:created});
    didCreate=true;
  });
  postosRegistry=created||[{id:"posto1",nome:"Posto 1"}];
  if(didCreate) logAudit("bootstrap_registry",REGISTRY_ID,{postos:postosRegistry.length});
  return postosRegistry;
}

// Troca de posto — espelha o fluxo logout→login (detach + reset paginado + reset
// STATE + reload do meta do posto novo). window.* (handler inline do <select>).
window.switchPosto=async function(id){
  if(id===activePosto) return;
  if(!postosRegistry.some(p=>p.id===id)){ renderPostoSelector(); return; }  // repõe seleção se id inválido
  // GUARD A (anti-corrupção cruzada): um save debounced pendente disparando DEPOIS da
  // troca gravaria registros do posto ANTIGO nos day-docs do posto NOVO (metaDocId/
  // dayDocId derivam de activePosto). Então: cancela o timer e dá FLUSH síncrono com o
  // activePosto ANTIGO ainda ativo, ANTES de qualquer detach/reset/troca. flushSave
  // NÃO relança (engole o erro e mantém _savePending=true) → o sinal de falha é o
  // _savePending continuar true após o await. Se FALHOU, ABORTA a troca — resetar aqui
  // apagaria edições não salvas do posto antigo.
  if(saveTimeout){ clearTimeout(saveTimeout); saveTimeout=null; }
  if(_savePending){
    await flushSave();
    if(_savePending){   // ainda pendente → o flush FALHOU
      console.error("[switchPosto] flush do save pendente falhou — troca cancelada");
      showDataWarning(`Há alterações não salvas em ${activePosto} que não puderam ser gravadas. Troca de posto cancelada — tente novamente.`);
      renderPostoSelector();   // repõe a seleção no posto atual (o <select> já mudou visualmente)
      return;
    }
  }
  // Espelho do logout→login (sem sair da sessão):
  detachPaginatedListeners();
  paginatedMode=false; daysIndex=[]; loadedDays.clear(); _baselineByDay.clear();
  STATE.sales=[]; STATE.bank=[]; STATE.mdr=DEFAULT_MDR; STATE.config=DEFAULT_CONFIG;
  filterStatus="todos"; filterMonth=""; resumoMonth=""; mdrBandeira="Visa";
  activePosto=id; saveActivePosto(id);
  await loadFromFirebase().catch(e=>{ console.error("[switchPosto] load falhou:",e?.code,e?.message); showAccessError(e); });
  try{ renderCurrentTab(); }catch(e){ console.error("[switchPosto] render falhou:",e); showAccessError(e); }
  attachPaginatedListeners();
  logAudit("switch_posto",id,{});
};

// Renomeia o posto ATIVO: grava o nome no meta (config.postoName, via saveToFirebase)
// E sincroniza o nome no registry (fonte do seletor) — tx get→set p/ não clobberar
// outra aba. Chamado pelo input "Nome do Posto" do Config. window.* (handler inline).
window.renamePosto=async function(nome){
  nome=String(nome||"").trim().slice(0,100);
  STATE.config.postoName=nome;
  saveToFirebase();                          // persiste no meta do posto ativo (config)
  renderPostoSelector();                     // reflete de imediato no header
  try{
    await runTransaction(db,async(tx)=>{
      const ref=doc(db,"conciliacao",REGISTRY_ID);
      const s=await tx.get(ref);
      const list=(s.exists()&&Array.isArray(s.data().postos))?s.data().postos:postosRegistry;
      const next=list.map(p=>p.id===activePosto?{...p,nome}:p);
      tx.set(ref,{postos:next});
      postosRegistry=next;
    });
  }catch(e){ console.error("[renamePosto] falha ao sincronizar registry:",e); }
  renderPostoSelector();
  logAudit("rename_posto",activePosto,{nome});
};

// Cria um posto novo: grava postoN_meta {schemaVersion:2, config:DEFAULT_CONFIG(+nome),
// mdr:DEFAULT_MDR, days:[]} + entrada no registry, numa ÚNICA transação → nasce direto
// em modo diário, vazio. GUARD B: lê o registry DENTRO da tx (tx.get) e monta a lista
// nova a partir do REMOTO (não da cópia em memória) — evita clobber com outra aba que
// tenha criado um posto. id/shape validados no cliente (rules não iteram a lista).
window.createPosto=async function(nome){
  nome=String(nome||"").trim().slice(0,100);
  if(!nome){ showMsg("postos-msg","Informe um nome para o novo posto.","err"); return; }
  let newId=null;
  try{
    await runTransaction(db,async(tx)=>{
      const regRef=doc(db,"conciliacao",REGISTRY_ID);
      const s=await tx.get(regRef);
      const list=(s.exists()&&Array.isArray(s.data().postos))?s.data().postos:[];
      // próximo id = maior postoN existente + 1 (varre os ids do remoto).
      let maxN=0;
      list.forEach(p=>{ const m=/^posto([0-9]+)$/.exec(p&&p.id||""); if(m){ const n=+m[1]; if(n>maxN)maxN=n; } });
      newId="posto"+(maxN+1);
      if(!/^posto[0-9]+$/.test(newId)) throw new Error("id inválido gerado: "+newId);
      const next=[...list,{id:newId,nome}];
      if(next.length>50) throw new Error("limite de 50 postos atingido");
      const cfg={...DEFAULT_CONFIG,postoName:nome};
      tx.set(doc(db,"conciliacao",`${newId}_meta`),{schemaVersion:2,config:cfg,mdr:DEFAULT_MDR,days:[]});
      tx.set(regRef,{postos:next});
      postosRegistry=next;
    });
  }catch(e){
    console.error("[createPosto] falha:",e?.code,e?.message);
    showMsg("postos-msg","Falha ao criar posto: "+(e?.message||e?.code||"erro"),"err");
    return;
  }
  logAudit("create_posto",newId,{nome});
  showMsg("postos-msg",`Posto ${newId} (${nome}) criado. Selecione-o no topo para abrir.`,"ok");
  renderPostoSelector();
  if(currentTab==="config") renderConfig();   // atualiza a lista de postos no card
};

async function loadFromFirebase(){
  // Multi-posto (modo diário único): cada posto tem seu meta postoN_meta com
  // schemaVersion>=2 — nasce assim (createPosto) e o posto1 já está migrado. O modelo
  // LEGADO (single-doc) foi removido; não há mais fallback. Meta ausente/inválido →
  // STATE vazio + banner (não deveria acontecer para um posto do registry).
  const metaSnap=await getDoc(doc(db,"conciliacao",metaDocId()));
  const meta=metaSnap.exists()?metaSnap.data():null;
  const sv=meta?Number(meta.schemaVersion)||0:0;
  if(meta&&sv>=2){
    paginatedMode=true;
    loadMetaIntoState(meta);
    const active=pickActiveMonth(daysIndex);
    filterMonth=resumoMonth=active;   // default casa com o mês carregado
    await ensureMonthLoaded(active);
    hideAccessError();
    return;
  }
  showDataWarning(`Meta do posto ${activePosto} não encontrado ou inválido (esperado schemaVersion>=2).`);
}

// ── Paginação por DIA — read path (ativo com schemaVersion>=2) ──────────────────
// Aplica config/mdr/índice de DIAS vindos do posto1_meta sobre os defaults.
function loadMetaIntoState(d){
  if(d.mdr)STATE.mdr=sanitizeMdr({...DEFAULT_MDR,...d.mdr});
  if(d.config)STATE.config=sanitizeConfig({...DEFAULT_CONFIG,...d.config});
  daysIndex=Array.isArray(d.days)?d.days:[];
}
// Mês ativo no boot = mês corrente; se não estiver no índice, o mais recente dele.
// O índice é por DIA → meses = únicos dia.slice(0,7).
function pickActiveMonth(index){
  const cur=monthKey(todays());
  const meses=[...new Set(index.map(x=>monthKey(x.dia)))].sort();
  if(meses.includes(cur))return cur;
  return meses.length?meses[meses.length-1]:cur;
}
// Meses disponíveis para os dropdowns. No paginado derivam do índice de dias
// (únicos dia.slice(0,7)); no legado, varre o STATE por date (união vendas∪banco).
function availableMonths(){
  if(paginatedMode) return [...new Set(daysIndex.map(x=>monthKey(x.dia)))].sort().reverse();
  const s=new Set();
  STATE.sales.forEach(x=>{ const k=monthKey(x.date); if(k)s.add(k); });
  STATE.bank.forEach(x=>{ const k=monthKey(x.date); if(k)s.add(k); });
  return [...s].sort().reverse();
}
// Garante os day-docs do mês `mes` + lookback carregados em STATE (ANEXA aos arrays
// — não substitui). daysOfMonthToLoad devolve só os dias que EXISTEM no índice
// (zero miss). Dia já em loadedDays é pulado (cache → sem refetch). Baseline por dia
// em _baselineByDay (isolado do _baseline* legado).
async function ensureMonthLoaded(mes){
  const needed=daysOfMonthToLoad(mes);
  // Dias ainda não carregados, na ordem original e sem duplicatas (mesmo skip do
  // loop antigo: pula loadedDays e não reprocessa dia repetido no mesmo needed).
  const seen=new Set(), toLoad=[];
  for(const dia of needed){ if(loadedDays.has(dia)||seen.has(dia))continue; seen.add(dia); toLoad.push(dia); }
  // getDoc em PARALELO (antes era sequencial: 1 RTT por dia → ~3s com 11 dias).
  const snaps=await Promise.all(toLoad.map(dia=>getDoc(doc(db,"conciliacao",dayDocId(dia)))));
  // Processa na ordem determinística de toLoad — semântica idêntica (push/baseline/skipped).
  let skipped=0;
  toLoad.forEach((dia,i)=>{
    const snap=snaps[i];
    const data=snap.exists()?snap.data():{};
    const rs=sanitizeRemoteList(data.sales,normSale);
    const rb=sanitizeRemoteList(data.bank,normBank);
    STATE.sales.push(...rs.list);
    STATE.bank.push(...rb.list);
    _baselineByDay.set(dia,{saleIds:new Set(rs.list.map(s=>s.id)),bankIds:new Set(rb.list.map(b=>b.id))});
    loadedDays.add(dia);
    skipped+=rs.skipped+rb.skipped;
  });
  if(skipped>0) showDataWarning(`${skipped} registro(s) inválido(s) foram ignorados.`); else hideDataWarning();
}

// ── Paginação por DIA — listeners em tempo real (ativo com schemaVersion>=2) ─────
// onSnapshot do meta: config/mdr/índice de dias mudaram remotamente.
function onMetaSnap(snap){
  try{
    if(snap.exists()&&snap.metadata.hasPendingWrites===false){
      loadMetaIntoState(snap.data());
      hideAccessError();
      if(document.getElementById("app").style.display!=="none") renderCurrentTab();
    }
  }catch(e){ console.error("[snapshot meta] falha:",e); showAccessError(e); }
}
function onListenerErr(err){
  console.error("[snapshot] erro no listener:",err?.code,err?.message);
  showAccessError(err);
}
// Troca em STATE SÓ os registros do dia `dia` (filtra fora os daquele dia e injeta
// os novos), preservando os demais dias carregados. Atualiza o baseline do dia.
function replaceDayInState(dia,sales,bank){
  STATE.sales=STATE.sales.filter(s=>partitionDay(s)!==dia).concat(sales);
  STATE.bank=STATE.bank.filter(b=>partitionDay(b)!==dia).concat(bank);
  _baselineByDay.set(dia,{saleIds:new Set(sales.map(s=>s.id)),bankIds:new Set(bank.map(b=>b.id))});
}
// onSnapshot de um doc de dia: aplica só os registros daquele dia (ignora writes
// próprios via hasPendingWrites, igual ao legado).
function onDaySnap(dia,snap){
  try{
    if(snap.exists()&&snap.metadata.hasPendingWrites===false){
      const d=snap.data();
      const rs=sanitizeRemoteList(d.sales,normSale);
      const rb=sanitizeRemoteList(d.bank,normBank);
      replaceDayInState(dia,rs.list,rb.list);
      hideAccessError();
      const sk=rs.skipped+rb.skipped;
      if(sk>0) showDataWarning(`${sk} registro(s) remoto(s) inválido(s) foram ignorados.`); else hideDataWarning();
      if(document.getElementById("app").style.display!=="none") renderCurrentTab();
    }
  }catch(e){ console.error("[snapshot dia] falha ao aplicar dados remotos:",e); showAccessError(e); }
}
// PORT FIEL: garante 1 listener ativo em CADA day-doc do mês `mes` e solta os de
// dias fora desse mês (attach/detach na troca de mês). Preserva a semântica antiga
// (mudou algo no mês visível → re-render), agora com granularidade diária (~26-31
// listeners por mês). TOGGLE FUTURO (versão enxuta): se a contagem de listeners
// incomodar, ouvir só o dia de HOJE (único doc que outro usuário escreve ao vivo) e
// tratar dias históricos como imutáveis pós-getDoc — trocaria daysOfMonthToLoad(mes)
// abaixo por [todays()] filtrado ao mês, mantendo o resto.
function ensureMonthListeners(mes){
  const dias=new Set(daysOfMonthToLoad(mes));
  for(const dia of dias){
    if(!dayListeners.has(dia)){
      dayListeners.set(dia,onSnapshot(doc(db,"conciliacao",dayDocId(dia)),s=>onDaySnap(dia,s),onListenerErr));
    }
  }
  for(const [d,unsub] of dayListeners){ if(!dias.has(d)){ unsub(); dayListeners.delete(d); } }
}
// Liga os listeners paginados: meta (config/mdr/índice) + day-docs do mês ativo.
function attachPaginatedListeners(){
  metaListener=onSnapshot(doc(db,"conciliacao",metaDocId()),onMetaSnap,onListenerErr);
  ensureMonthListeners(pickActiveMonth(daysIndex));
}
// Solta todos os listeners paginados (logout).
function detachPaginatedListeners(){
  if(metaListener){ metaListener(); metaListener=null; }
  for(const [,unsub] of dayListeners){ unsub(); }
  dayListeners.clear();
}

function setSyncStatus(state,detail){
  const dot=document.getElementById("sync-dot");
  const txt=document.getElementById("sync-text");
  const wrap=document.getElementById("sync-status");
  if(!dot||!txt||!wrap)return;
  dot.className="sync-dot";
  wrap.className="posto-sub";
  if(state==="saving"){
    dot.classList.add("saving");
    txt.textContent="Salvando…";
  }else if(state==="error"){
    dot.classList.add("error");
    wrap.classList.add("error");
    txt.innerHTML='⚠️ Falha ao salvar — dados NÃO enviados.<button class="sync-retry" onclick="retrySave()">Tentar novamente</button>';
  }else if(state==="warn"){
    dot.classList.add("warn");
    txt.textContent=`Sincronizado · ⚠️ base em ${detail} KB de ~1 MB — considere arquivar dados antigos`;
  }else{ // saved
    txt.textContent="Sincronizado com Firebase";
  }
}

// Erro de acesso ÓBVIO na tela. permission-denied → banner fixo no topo
// (o usuário autenticou mas não tem papel admin/partner). Qualquer outro
// erro → status de sync vermelho (com botão "Tentar novamente"), já existente.
function showAccessError(err){
  if(err?.code==="permission-denied"){
    const b=document.getElementById("access-banner");
    if(b){
      b.textContent="🔒 Sua conta não tem permissão de acesso. Contate o administrador para receber um papel (admin/partner).";
      b.style.display="block";
    }
  }else{
    setSyncStatus("error");
  }
}
// Some com o banner quando o acesso volta a funcionar (load/snapshot OK).
function hideAccessError(){
  const b=document.getElementById("access-banner");
  if(b) b.style.display="none";
}
// Aviso ÂMBAR — registros remotos inválidos foram pulados (corrupção de dados),
// semântica distinta do #access-banner (vermelho = sem permissão).
function showDataWarning(msg){
  const b=document.getElementById("data-banner");
  if(b){ b.textContent="⚠️ "+msg; b.style.display="block"; }
}
function hideDataWarning(){
  const b=document.getElementById("data-banner");
  if(b) b.style.display="none";
}

// ── Paginação por DIA — write path (ativo com schemaVersion>=2) ──────────────────
// Bytes (UTF-8) de um doc de dia {sales,bank} — warn é POR day-doc, não global.
function dayDocBytes(dd){
  try{ return new TextEncoder().encode(JSON.stringify({sales:dd.sales,bank:dd.bank})).length; }
  catch(e){ return 0; }
}
// Payload do posto1_meta: config/mdr last-writer-wins + índice de DIAS atualizado.
// Parte do índice remoto e sobrescreve a contagem dos dias escritos nesta tx
// (acrescenta entrada p/ dia novo). Preserva schemaVersion (default 2 = modo diário).
function writeMetaPayload(remoteMeta,result){
  const rm=remoteMeta||{};
  const idx=new Map((Array.isArray(rm.days)?rm.days:[]).map(x=>[x.dia,x]));
  for(const [dia,dd] of result){ idx.set(dia,{dia,salesCount:dd.sales.length,bankCount:dd.bank.length}); }
  const days=[...idx.values()].sort((a,b)=>a.dia.localeCompare(b.dia));
  return {schemaVersion:rm.schemaVersion||2,config:STATE.config,mdr:STATE.mdr,days};
}
// Save paginado: UMA transação multi-doc sobre os DIAS afetados + meta. Atômica →
// o move de venda entre dias (delete na origem + add no destino) commita junto.
async function flushSavePaginated(){
  // Write-set = dias carregados ∪ dia-partição de CADA registro do STATE. O 2º termo
  // garante que registro movido p/ dia NÃO carregado também seja gravado: baseline
  // vazio faz mergeListById só ADICIONAR (parte do remoto, não clobbera nem deleta).
  const days=new Set(loadedDays);
  STATE.sales.forEach(s=>{ const d=partitionDay(s); if(d)days.add(d); });
  STATE.bank.forEach(b=>{ const d=partitionDay(b); if(d)days.add(d); });
  const metaRef=doc(db,"conciliacao",metaDocId());
  const result=new Map();
  let metaPayload=null;
  await runTransaction(db,async(tx)=>{
    result.clear(); metaPayload=null;              // tx pode re-executar (retry) → zera acumuladores
    // READS primeiro (regra do Firestore): meta + cada day-doc afetado.
    const metaSnap=await tx.get(metaRef);
    const remote=new Map();
    for(const dia of days){ const s=await tx.get(doc(db,"conciliacao",dayDocId(dia))); remote.set(dia,s.exists()?s.data():{}); }
    // MERGE por dia (mergeListById reusado; fatia local + baseline DAQUELE dia).
    for(const dia of days){
      const r=remote.get(dia);
      const localS=STATE.sales.filter(s=>partitionDay(s)===dia);
      const localB=STATE.bank.filter(b=>partitionDay(b)===dia);
      const base=_baselineByDay.get(dia)||{saleIds:new Set(),bankIds:new Set()};
      result.set(dia,{sales:mergeListById(r.sales,localS,base.saleIds),bank:mergeListById(r.bank,localB,base.bankIds)});
    }
    // WRITES depois: cada day-doc + meta (mesma tx → tudo atômico).
    for(const dia of days){ tx.set(doc(db,"conciliacao",dayDocId(dia)),result.get(dia)); }
    metaPayload=writeMetaPayload(metaSnap.exists()?metaSnap.data():{},result);
    tx.set(metaRef,metaPayload);
  });
  // Aplica o merge de volta no STATE (reflete adds remotos), atualiza baseline+cache.
  for(const [dia,dd] of result){ replaceDayInState(dia,dd.sales,dd.bank); loadedDays.add(dia); }
  if(metaPayload) daysIndex=metaPayload.days;
  _savePending=false;
  if(document.getElementById("app").style.display!=="none") renderCurrentTab();
  // Teto de segurança POR day-doc: pega o maior dos dias escritos. Um dia real ≈ 129 KB;
  // >800 KB (~6× um dia) é anomalia (import duplicado / dia gigante) → banner VISÍVEL
  // além do sync-dot, para o operador agir antes de bater no limite físico de 1 MB.
  let maxBytes=0,maxDia=null;
  for(const [dia,dd] of result){ const b=dayDocBytes(dd); if(b>maxBytes){ maxBytes=b; maxDia=dia; } }
  if(maxBytes>DOC_SIZE_WARN){
    const kb=Math.round(maxBytes/1024);
    console.warn(`[saveToFirebase] day-doc ${maxDia} em ${kb} KB (limite ~1 MB por doc).`);
    setSyncStatus("warn",kb);
    showDataWarning(`Dia ${fmtDate(maxDia)} em ${kb} KB — perto do limite de 1 MB por day-doc. Verifique volume anormal.`);
  }else{
    setSyncStatus("saved");
  }
  // Trilha de auditoria (best-effort, fora da tx): registra o save paginado.
  logAudit("save_paginated",`${activePosto}_meta+dias`,{daysCount:result.size,salesTotal:STATE.sales.length,bankTotal:STATE.bank.length});
}

async function flushSave(){
  setSyncStatus("saving");
  try{
    await flushSavePaginated();
  }catch(e){
    _savePending=true;
    console.error("[saveToFirebase] falha ao gravar:",e?.code,e?.message,e);
    setSyncStatus("error");
  }
}

function saveToFirebase(){
  _savePending=true;
  setSyncStatus("saving");
  if(saveTimeout)clearTimeout(saveTimeout);
  saveTimeout=setTimeout(flushSave,800);
}

window.retrySave=function(){
  if(saveTimeout)clearTimeout(saveTimeout);
  flushSave();
};

// ─── Trilha de auditoria (Nível 1, append-only) ───────────────────────────────
// Best-effort: grava UM doc em audit_log por evento de escrita financeira. SEPARADO
// das transações (fora do tx) e embrulhado em try/catch que SÓ faz console.warn —
// uma falha de log NUNCA pode derrubar a gravação. ts = serverTimestamp() (servidor).
async function logAudit(action, target, summary){
  try{
    // posto vai DENTRO de summary (map): o envelope do audit_log tem hasOnly fixo nas
    // rules (sem campo top-level `posto`) — injetar aqui carimba TODA ação com o posto
    // ativo sem tocar nas rules. Multi-posto: distingue qual posto fez cada gravação.
    await addDoc(collection(db,"audit_log"),{
      ts: serverTimestamp(),
      action, target,
      uid: auth.currentUser?.uid,
      email: auth.currentUser?.email || null,
      role: _currentRole || null,
      summary: { ...(summary || {}), posto: activePosto },
    });
  }catch(e){ console.warn("[audit] falha ao registrar (ignorada):", e?.code||e?.message); }
}

// ─── Auth state ───────────────────────────────────────────────────────────────
onAuthStateChanged(auth,async(user)=>{
  if(user){
    clearLoginState();
    // Captura o role (claim) ANTES do bootstrap/audit — a trilha registra quem fez.
    try{ const r=await user.getIdTokenResult(); _currentRole=r.claims.role||null; }catch(e){ _currentRole=null; }
    document.getElementById("login-screen").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("login-email").value="";
    document.getElementById("login-input").value="";
    document.getElementById("login-error").textContent="";
    // Multi-posto: carrega o registry (bootstrap se ausente) e escolhe o posto ativo.
    try{
      await ensureRegistry();
      activePosto=resolveActivePosto();
      saveActivePosto(activePosto);
    }catch(e){
      console.error("[ensureRegistry] falha:",e?.code,e?.message);
      showAccessError(e);
    }
    await loadFromFirebase().catch(e=>{
      console.error("[loadFromFirebase] falha:",e?.code,e?.message);
      showAccessError(e);
    });
    try{ renderCurrentTab(); }
    catch(e){
      console.error("[render] falha ao renderizar aba:",e);
      showAccessError(e);
    }
    // Modo diário único: sempre listeners paginados (meta + day-docs do mês ativo).
    attachPaginatedListeners();
    resetSessionTimer();
    ['mousemove','click','keydown','scroll','touchstart'].forEach(ev=>{
      document.addEventListener(ev,resetSessionTimer,{passive:true});
    });
  }else{
    _currentRole=null;
    document.getElementById("app").style.display="none";
    document.getElementById("login-screen").style.display="flex";
    detachPaginatedListeners(); // solta listeners paginados (meta + day-docs)
    paginatedMode=false; daysIndex=[]; loadedDays.clear(); _baselineByDay.clear(); postosRegistry=[];
    clearSessionTimer();
    // Muta em vez de reatribuir: preserva a identidade do objeto p/ window.STATE.
    STATE.sales=[]; STATE.bank=[]; STATE.mdr=DEFAULT_MDR; STATE.config=DEFAULT_CONFIG;
    filterStatus="todos"; filterMonth=""; resumoMonth=""; mdrBandeira="Visa";
  }
});

window.doLogin=async function(){
  const errEl=document.getElementById("login-error");
  const lockedMs=getLockedOutMs();
  if(lockedMs>0){
    errEl.textContent=`Muitas tentativas. Aguarde ${Math.ceil(lockedMs/60000)} min.`;
    return;
  }
  const email=document.getElementById("login-email").value.trim();
  const password=document.getElementById("login-input").value;
  if(!email||!password){ errEl.textContent="Preencha e-mail e senha."; return; }
  try{
    await signInWithEmailAndPassword(auth,email,password);
  }catch(e){
    console.error("[Login] Firebase error:", e.code, e.message);
    // Erros de configuração/infraestrutura — não contam como tentativa falha
    const configErrors={
      "auth/operation-not-allowed":"Autenticação por e-mail não está ativada no Firebase Console.",
      "auth/configuration-not-found":"Firebase Auth não está configurado. Verifique o console Firebase.",
      "auth/network-request-failed":"Erro de conexão. Verifique sua internet.",
      "auth/internal-error":"Erro interno do Firebase. Tente novamente.",
    };
    if(configErrors[e.code]){
      errEl.textContent=configErrors[e.code];
      setTimeout(()=>{ if(errEl)errEl.textContent=""; },6000);
      return;
    }
    // Credencial inválida — conta como tentativa
    recordLoginFailure();
    const lockedAfter=getLockedOutMs();
    if(lockedAfter>0){
      errEl.textContent=`Bloqueado por ${Math.ceil(lockedAfter/60000)} min após muitas tentativas.`;
    }else{
      const remaining=MAX_LOGIN_ATTEMPTS-getLoginState().attempts;
      errEl.textContent=`Senha incorreta. ${remaining} tentativa(s) restante(s).`;
    }
    setTimeout(()=>{ if(errEl)errEl.textContent=""; },4000);
  }
};

          <option value="">Todos os meses</option>${monthOpts}

        <div class="pills">
          ${statusOpts.map(s=>`<button class="pill${filterStatus===s?" active":""}" onclick="setFilterStatus('${s}')">${statusLabels[s]}</button>`).join("")}
        </div>

    <div class="card">
      ${filtered.length===0?`<div class="empty">Nenhum registro. Lance vendas na aba Vendas.</div>`:`

function getBadge(status){

// ── Drill-down: matching item-a-item de um dia (SÓ-LEITURA) ────────────────────
// Reusa STATE.bank (nenhum read novo). Pareamento guloso por VALOR dentro da
// tolerância configurada — os dados reais são 1:1 (banco credita por transação),
// mas os subtotais por coluna funcionam como rede se algum dia vier agregado.
function matchDayItems(r){
  const tol=STATE.config.tolerance;
  const profile=profileFor(STATE.config);
  const sales=[...r.sales].sort((a,b)=>b.liquido-a.liquido);
  const credits=STATE.bank.filter(e=>e.date===r.date && isBankConciliavel(classifyBank(e.description,profile)))
    .map(e=>({amount:Number(e.amount),description:e.description}))
    .sort((a,b)=>b.amount-a.amount);
  const used=new Array(credits.length).fill(false);
  const pairs=[],salesOnly=[];
  sales.forEach(s=>{
    let hit=-1;
    for(let j=0;j<credits.length;j++){
      if(!used[j]&&Math.abs(credits[j].amount-s.liquido)<=tol){ hit=j; break; }
    }
    // diff a 4 casas: elimina o resíduo de float da subtração de 2 casas
    // (4.11-4.10=0.00999…) sem esconder diferença sub-centavo genuína (ponto 3).
    if(hit>=0){ used[hit]=true; pairs.push({sale:s,credit:credits[hit],diff:Math.round((credits[hit].amount-s.liquido)*1e4)/1e4}); }
    else salesOnly.push(s);
  });
  const creditsOnly=credits.filter((_,j)=>!used[j]);
  return {pairs,salesOnly,creditsOnly,tol};
}

// Monta o painel de detalhe do dia (chamado só p/ o dia aberto).
function dayDetailHtml(r){
  const m=matchDayItems(r);
  const diffColor=Math.abs(r.diff)<.01?"var(--muted)":r.diff>0?"var(--accent)":"var(--red)";
  const diffStr=(r.diff>=0?"+":"")+fmtBRL(r.diff);

  // Culpado = par dentro da tolerância mas com diferença (|diff|>=0.01). Vem
  // PRIMEIRO; verde fica só p/ diff zero. Reordena m.pairs uma vez p/ manter as
  // duas colunas alinhadas (par i na esquerda = par i na direita).
  const isTol=p=>Math.abs(p.diff)>=.01;
  const orderedPairs=[...m.pairs.filter(isTol),...m.pairs.filter(p=>!isTol(p))];
  const sumPairDiff=round2(m.pairs.reduce((a,p)=>a+p.diff,0));

  // Coluna Vendas: órfãs (⚠) no TOPO → culpados (âmbar ≈, chip da dif.) → verdes (✓).
  // Órfão/âmbar sobem p/ não ficarem enterrados sob centenas de pares perfeitos.
  const saleItems=[
    ...m.salesOnly.map(s=>`<div class="match-item match-orphan-sale"><span class="mi-l">⚠ ${escHtml(s.bandeira)} · ${escHtml(s.modality)} — sem crédito</span><span class="mi-r" style="color:var(--red)">${fmtBRL(s.liquido)}</span></div>`),
    ...orderedPairs.map(p=>{
      const cls=isTol(p)?"match-tol":"match-ok", mark=isTol(p)?"≈":"✓";
      const chip=isTol(p)?`<span class="match-diff">${p.diff>0?"+":""}${fmtBRL(p.diff)}</span>`:"";
      return `<div class="match-item ${cls}"><span class="mi-l">${mark} ${escHtml(p.sale.bandeira)} · ${escHtml(p.sale.modality)}</span><span class="mi-r">${fmtBRL(p.sale.liquido)}${chip}</span></div>`;
    }),
  ].join("")||`<div class="detail-empty">Nenhuma venda neste dia.</div>`;

  // Coluna Créditos: órfãos (⚠) no TOPO → mesma ordem dos pares (alinha com Vendas).
  const bankItems=[
    ...m.creditsOnly.map(c=>`<div class="match-item match-orphan-bank"><span class="mi-l">⚠ ${escHtml(c.description)||"—"} — sem venda</span><span class="mi-r" style="color:var(--purple)">${fmtBRL(c.amount)}</span></div>`),
    ...orderedPairs.map(p=>{
      const cls=isTol(p)?"match-tol":"match-ok", mark=isTol(p)?"≈":"✓";
      return `<div class="match-item ${cls}"><span class="mi-l">${mark} ${escHtml(p.credit.description)||"—"}</span><span class="mi-r">${fmtBRL(p.credit.amount)}</span></div>`;
    }),
  ].join("")||`<div class="detail-empty">Nenhum crédito no banco neste dia.</div>`;

  // Nota sub-centavo: dia divergente, nenhum culpado >=1¢ e sem órfãos → a
  // diferença do dia é só acúmulo de arredondamentos sub-centavo dos pares.
  const subCent=m.pairs.filter(p=>p.diff!==0).length;
  const noteHtml=(r.status==="divergencia"&&!m.pairs.some(isTol)&&!m.salesOnly.length&&!m.creditsOnly.length)
    ?`<div class="detail-legend" style="color:var(--accent)">ℹ️ Diferença distribuída em arredondamentos sub-centavo de ${subCent} itens.</div>`:"";

  const sumColor=Math.abs(sumPairDiff)<.01?"var(--muted)":sumPairDiff>0?"var(--accent)":"var(--red)";

  return `<div class="detail-panel">
    <div class="detail-head">
      ${getBadge(r.status)}
      <span>Líquido esperado: <strong style="color:var(--green)">${fmtBRL(r.liquido)}</strong></span>
      <span>Banco: <strong style="color:var(--blue)">${fmtBRL(r.actual)}</strong></span>
      <span>Diferença: <strong style="color:${diffColor}">${diffStr}</strong></span>
      <span>Σ diferenças dos pares: <strong style="color:${sumColor}">${sumPairDiff>=0?"+":""}${fmtBRL(sumPairDiff)}</strong></span>
    </div>
    <div class="detail-cols">
      <div class="detail-col">
        <h4>Vendas — líquido esperado (${r.sales.length})</h4>
        ${saleItems}
        <div class="detail-tot"><span>Total esperado</span><span style="color:var(--green)">${fmtBRL(r.liquido)}</span></div>
      </div>
      <div class="detail-col">
        <h4>Créditos no banco (${m.pairs.length+m.creditsOnly.length})</h4>
        ${bankItems}
        <div class="detail-tot"><span>Total banco</span><span style="color:var(--blue)">${fmtBRL(r.actual)}</span></div>
      </div>
    </div>
    ${noteHtml}
    <div class="detail-legend">✓ igual · ≈ dentro da tolerância (${fmtBRL(m.tol)}) mas com diferença — o chip mostra quanto · ⚠ sem correspondência — o valor à direita é a diferença exata que não bateu.</div>
  </div>`;
}

function calcPreview(){
  const bruto=Number(vForm.amount)||0;
  const taxa=getMDR(vForm.bandeira,vForm.modality);
  const custoMDR=round2(bruto*taxa);     // mesmo arredondamento do enrichSale
  const liquido=round2(bruto-custoMDR);
  const days=STATE.config.liquidation[vForm.modality]??1;
  const isCorridos=STATE.config.corridos[vForm.modality]??false;
  const dep=calcDeposit(vForm.date,vForm.modality);
  const dow=new Date(vForm.date+"T12:00:00").getDay();
  return{bruto,taxa,custoMDR,liquido,days,dep,isCorridos,isFds:dow===0||dow===6,isFer:STATE.config.holidays.includes(vForm.date)};
}

window.addSale=function(){
  if(!vForm.date||!vForm.bandeira||!vForm.modality||!vForm.amount||Number(vForm.amount)<=0){
    showMsg("venda-msg","Preencha todos os campos.","err");return;
  }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(vForm.date)){showMsg("venda-msg","Data inválida.","err");return;}
  if(!BANDEIRAS.includes(vForm.bandeira)){showMsg("venda-msg","Bandeira inválida.","err");return;}
  if(!MODALITIES.find(m=>m.name===vForm.modality)){showMsg("venda-msg","Modalidade inválida.","err");return;}
  if(Number(vForm.amount)>9999999){showMsg("venda-msg","Valor inválido.","err");return;}
  STATE.sales.unshift({...vForm,id:uid(),amount:Number(vForm.amount),expectedDate:calcDeposit(vForm.date,vForm.modality)});
  vForm.amount="";  // muta (não reatribui) p/ manter o alias window.vForm
  saveToFirebase();
  renderVendas();
  // showMsg DEPOIS do renderVendas: o render reconstrói #tab-vendas (e o #venda-msg),
  // então a mensagem de sucesso só sobrevive se escrita após o render (mesmo fix do importPDF).
  showMsg("venda-msg","✅ Adicionado!","ok");
};

// PDF importer for PagBank sales report
window.importPDF=function(input){
  const file=input.files[0]; if(!file) return;
  if(file.type&&file.type!=="application/pdf"){
    showMsg("venda-msg","Arquivo inválido. Selecione um PDF.","err");
    input.value=""; return;
  }
  if(file.size>MAX_FILE_SIZE){
    showMsg("venda-msg","Arquivo muito grande (máx. 10 MB).","err");
    input.value=""; return;
  }
  showMsg("venda-msg","⏳ Lendo PDF...","ok");
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      // Load PDF.js
      if(!window.pdfjsLib){
        await new Promise((res,rej)=>{
          const s=document.createElement('script');
          s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
          s.onload=res; s.onerror=rej;
          document.head.appendChild(s);
        });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
      const pdf=await pdfjsLib.getDocument({data:e.target.result}).promise;
      let allText='';
      let globalIdx=0;
      for(let i=1;i<=pdf.numPages;i++){
        const page=await pdf.getPage(i);
        const content=await page.getTextContent();
        content.items.forEach(function(item){
          if(item.str&&item.str.trim()){
            allText+='['+globalIdx+'] '+item.str.trim()+'\n';
          }
          globalIdx++; // always increment to preserve PDF item spacing
        });
      }
      const parsed=parsePagBankPDF(allText);
      const imported=parsed.sales;
      const skipped=parsed.skipped;
      if(imported.length===0){
        showMsg("venda-msg",skipped>0?`Nenhuma transação válida. ${skipped} linha(s) ignorada(s) — use o botão Debug PDF para conferir o leiaute.`:"Nenhuma transação encontrada no PDF.","err");
        return;
      }
      // Deduplicate by checking existing ids
      const existingIds=new Set(STATE.sales.map(s=>s.extId).filter(Boolean));
      const news=imported.filter(s=>!existingIds.has(s.extId));
      STATE.sales=[...news,...STATE.sales];
      saveToFirebase();
      if(skipped>0) console.warn(`[importPDF] ${skipped} transação(ões) ignorada(s) por falta de data válida.`);
      const skipMsg=skipped>0?`, ${skipped} ignorada(s)`:"";
      renderVendas();
      // showMsg DEPOIS do renderVendas: o render reconstrói #tab-vendas (e o #venda-msg),
      // então a mensagem de sucesso só sobrevive se escrita após o render (corrige o
      // aviso de sucesso que antes era apagado no mesmo tick).
      showMsg("venda-msg",`✅ ${news.length} transações importadas! (${imported.length-news.length} duplicatas${skipMsg})`,"ok");
      // AVISO de sanidade (sub-2): registros marcados como suspeitos pelo parser
      // (bruto ≠ líquido+taxa → possível mudança de layout do PDF). As vendas já
      // entraram em STATE.sales (sem rejeição, sem mudar a dedupe); aqui só ALERTAMOS.
      const suspeitos=parsed.suspeitos||[];
      if(suspeitos.length>0){
        const lim=suspeitos.slice(0,10);
        const itens=lim.map(s=>`<div>• ${escHtml(s.date)} — ${fmtBRL(s.amount)} — ${escHtml(s.motivo)}</div>`).join("");
        const mais=suspeitos.length>10?`<div style="margin-top:4px">(+${suspeitos.length-10} mais)</div>`:"";
        const pv=document.getElementById("venda-preview");
        if(pv) pv.innerHTML=`<div class="alert-late" style="background:#1a1400;border-color:#d4a01740;color:#e6c34a">⚠️ <strong>ATENÇÃO: ${suspeitos.length} de ${imported.length} registros têm valores inconsistentes (bruto ≠ líquido+taxa)</strong> — possível mudança no layout do PDF do PagBank. As vendas foram importadas, mas confira o extrato antes de conciliar.<div style="margin-top:8px;font-size:11px;line-height:1.6">${itens}${mais}</div></div>`;
      }
    }catch(err){
      showMsg("venda-msg","Erro ao ler PDF: "+err.message,"err");
    }
    input.value="";
  };
  reader.readAsArrayBuffer(file);
};

function parsePagBankPDF(text){
  var items=[];
  var lines=text.split("\n");
  lines.forEach(function(line){
    var m=line.match(/^\[(\d+)\]\s+(.+)$/);
    if(m) items.push({idx:parseInt(m[1]),val:m[2].trim()});
  });

  // Build lookups by index
  var vals={};    // R$ values
  var dates={};   // date strings dd/mm/yyyy
  var tipos={};   // tipo after Pagbank
  var reportDate="";

  items.forEach(function(item,i){
    // R$ values
    if(item.val.indexOf("R$")===0){
      var n=parseFloat(item.val.replace("R$","").replace(/\./g,"").replace(",",".").trim());
      if(!isNaN(n)&&n>=0) vals[item.idx]=n;
    }
    // Dates: dd/mm/yyyy HH:mm
    if(/^\d{2}\/\d{2}\/\d{4}\s+\d{2}:\d{2}$/.test(item.val)){
      dates[item.idx]=item.val.slice(0,10);
      if(!reportDate) reportDate=item.val.slice(0,10);
    }
    // Tipo: item after Pagbank
    if(item.val==="Pagbank"&&i+1<items.length){
      tipos[item.idx]=items[i+1].val;
    }
  });

  function mapTipo(tipo){
    var t=(tipo||"").toLowerCase();
    var bandeira="Outro",modality="Debito";
    if(t.indexOf("mastercard")>=0)bandeira="Mastercard";
    else if(t.indexOf("visa")>=0)bandeira="Visa";
    else if(t.indexOf("elo")>=0)bandeira="Elo";
    else if(t.indexOf("hipercard")>=0)bandeira="Hipercard";
    else if(t.indexOf("amex")>=0)bandeira="Amex";
    if(t.indexOf("pix")>=0){bandeira="Pix";modality="Pix";}
    else if(t.indexOf("bito")>=0)modality="Debito";
    else if(t.indexOf("dito")>=0){
      if(t.indexOf("2x")>=0||t.indexOf("3x")>=0||t.indexOf("4x")>=0||t.indexOf("5x")>=0||t.indexOf("6x")>=0)modality="Credito26x";
      else if(t.indexOf("7x")>=0||t.indexOf("8x")>=0||t.indexOf("9x")>=0||t.indexOf("10x")>=0||t.indexOf("11x")>=0||t.indexOf("12x")>=0)modality="Credito712x";
      else modality="CreditoVista";
    }
    else if(t.indexOf("voucher")>=0)modality="Voucher";
    var sysMap={"Debito":"Debito","CreditoVista":"CreditoVista","Credito26x":"Credito26x","Credito712x":"Credito712x","Voucher":"Voucher","Pix":"Pix"};
    var nameMap={"Debito":"D\u00e9bito","CreditoVista":"Cr\u00e9dito \u00c0 Vista","Credito26x":"Cr\u00e9dito 2\u20136x","Credito712x":"Cr\u00e9dito 7\u201312x","Voucher":"Voucher (VR/VA)","Pix":"Pix"};
    var k=sysMap[modality]||"Debito";
    return{bandeira:bandeira,modality:nameMap[k]||"D\u00e9bito"};
  }

  // Find bruto: vals[idx] where vals[idx+2] and vals[idx+4] exist
  var valIdxs=Object.keys(vals).map(Number).sort(function(a,b){return a-b;});
  var processed={};
  var sales=[];
  var skipped=0; // candidatos (bruto+taxa+líquido) descartados por falta de data válida
  var suspeitos=[]; // vendas montadas mas com checagem bruto≈taxa+líquido falha (offsets idx+2/idx+4 podem ter pego número errado)

  valIdxs.forEach(function(idx){
    if(processed[idx]) return;
    var taxaIdx=idx+2, liqIdx=idx+4;
    if(vals[taxaIdx]!==undefined&&vals[liqIdx]!==undefined){
      var bruto=vals[idx];
      processed[idx]=true;
      processed[taxaIdx]=true;
      processed[liqIdx]=true;

      // Search for date near bruto+5 (window ±3 to handle UUID split)
      var dateStr="";
      for(var d=-1;d<=4;d++){
        if(dates[idx+5+d]){dateStr=dates[idx+5+d];break;}
      }
      if(!dateStr) dateStr=reportDate;

      // Search for tipo near bruto+7 (Pagbank index, window ±3)
      var tipo="";
      for(var p=-1;p<=4;p++){
        if(tipos[idx+7+p]){tipo=tipos[idx+7+p];break;}
      }

      if(!dateStr||!bruto){ skipped++; return; }
      var parts=dateStr.split("/");
      if(parts.length!==3){ skipped++; return; }
      var isoDate=parts[2]+"-"+parts[1]+"-"+parts[0];
      var mt=mapTipo(tipo);
      var sale={id:uid(),extId:"pb_"+isoDate+"_"+idx+"_"+bruto,date:isoDate,bandeira:mt.bandeira,modality:mt.modality,amount:bruto,expectedDate:calcDeposit(isoDate,mt.modality)};
      // Preserva o líquido real do extrato quando a aritmética confirma que
      // os dois valores extras são taxa+líquido. Não depende da ordem:
      // líquido = maior, taxa = menor; valida que somam o bruto (±2 centavos).
      var v2=vals[taxaIdx], v4=vals[liqIdx];
      var liquidoReal=Math.max(v2,v4), taxaReal=Math.min(v2,v4);
      if(Math.abs(bruto-(v2+v4))<=0.02 && liquidoReal>=0 && liquidoReal<=bruto){
        sale.liquidoReal=liquidoReal;
      }else{
        // Checagem falhou: os valores em idx+2/idx+4 não batem com taxa+líquido do
        // bruto → o layout do PDF pode ter mudado e os offsets pegaram número errado.
        // SINALIZA (não mascara) mas NÃO descarta a venda (nunca perder venda).
        sale._suspeito=true;
        var motivo=(Math.abs(bruto-(v2+v4))>0.02)
          ? "bruto != liquido+taxa ("+bruto.toFixed(2)+" vs "+liquidoReal.toFixed(2)+"+"+taxaReal.toFixed(2)+")"
          : "liquido fora de faixa";
        suspeitos.push({date:isoDate,idx:idx,amount:bruto,v2:v2,v4:v4,motivo:motivo});
      }
      sales.push(sale);
    }
  });

  return {sales:sales, skipped:skipped, suspeitos:suspeitos};
}
