    </div>
  `;
}

window.setMdrBandeira=function(b){mdrBandeira=b;renderConfig();}

// Fase 4 sub-2: DRY-RUN do backfill — só preview/leitura. Chama buildBackfillPlan()
// (puro) e desenha o plano + conferência em #backfill-preview. NÃO grava, NÃO chama
// Firestore, NÃO muda STATE. window.* (handler inline). Tudo escapado via escHtml().
window.dryRunBackfill=function(){
  const plan=window.buildBackfillPlan();
  const el=document.getElementById("backfill-preview");
  if(!el)return;
  const t=plan.totais;
  const rows=plan.meses.map(m=>`<tr>
    <td>${escHtml(m.mes)}</td>
    <td style="text-align:right">${escHtml(m.salesCount)}</td>
    <td style="text-align:right">${escHtml(m.bankCount)}</td>
  </tr>`).join("");
  const selo=(ok)=>ok?`<span class="badge badge-ok">OK</span>`:`<span class="badge badge-late">DIVERGÊNCIA</span>`;
  const semMesAviso=(plan.semMes.salesCount>0||plan.semMes.bankCount>0)
    ? `<div class="alert-late" style="background:#1a1400;border-color:#d4a01740;color:#e6c34a;margin-top:12px">⚠️ <strong>${escHtml(plan.semMes.salesCount)} venda(s) e ${escHtml(plan.semMes.bankCount)} crédito(s) com data inválida (sem mês)</strong> — esses registros precisam de atenção antes de qualquer gravação; não entram em nenhum mês.</div>`
    : "";
  el.innerHTML=`
    <div class="table-wrap">
      <table>
        <thead><tr><th>Mês</th><th style="text-align:right">Vendas</th><th style="text-align:right">Créditos</th></tr></thead>
        <tbody>${rows||`<tr><td colspan="3" style="color:var(--muted)">Nenhum mês.</td></tr>`}</tbody>
        <tfoot><tr style="font-weight:700;border-top:1px solid var(--border)">
          <td>Total</td>
          <td style="text-align:right">${escHtml(t.planSales)}</td>
          <td style="text-align:right">${escHtml(t.planBank)}</td>
        </tr></tfoot>
      </table>
    </div>
    <div style="margin-top:12px;display:flex;flex-direction:column;gap:6px;font-size:12px">
      <div>Vendas: STATE ${escHtml(t.stateSales)} vs plano ${escHtml(t.planSales)} ${selo(t.salesOk)}</div>
      <div>Créditos: STATE ${escHtml(t.stateBank)} vs plano ${escHtml(t.planBank)} ${selo(t.bankOk)}</div>
    </div>
    ${semMesAviso}`;
};

// Fase 4 sub-3: EXECUÇÃO do backfill. Grava docs mensais + meta numa ÚNICA transação
// (padrão de flushSavePaginated: writes atômicos), com 3 travas antes e releitura de
// verificação depois. plan.meta NÃO tem schemaVersion → modo paginado segue desligado
// (cutover = Fase 5). NÃO toca no posto1 legado (coexistência). Idempotente (tx.set
// substitui o doc inteiro do mês). NÃO muda STATE, NÃO liga paginatedMode. window.*
// (handler inline). Dados escapados via escHtml().
window.executeBackfill=async function(){
  const el=document.getElementById("backfill-preview");
  const box=(bg,bd,fg,icon,msg)=>{ if(el) el.innerHTML=`<div class="alert-late" style="background:${bg};border-color:${bd};color:${fg};margin-top:12px">${icon} ${msg}</div>`; };
  const red=(msg)=>box("#1a0010","#e91e8c40","#f48fb1","⛔",msg);
  const amber=(msg)=>box("#1a1400","#d4a01740","#e6c34a","⚠️",msg);
  const green=(msg)=>box("#06160c","#1f7a3f","#7be0a3","✅",msg);
  const plan=window.buildBackfillPlan();
  const t=plan.totais;
  // TRAVA 1 — reconciliação STATE vs plano.
  if(t.salesOk===false||t.bankOk===false){ red("Reconciliação falhou (STATE vs plano divergente). Migração abortada."); return; }
  // TRAVA 2 — nada a migrar.
  if(plan.meses.length===0){ amber("Nenhum mês para migrar (banco vazio). Nada a fazer."); return; }
  // TRAVA 3 — confirmação explícita.
  const N=plan.meses.length;
  if(!confirm(`Isto vai gravar ${N} docs mensais + meta no Firestore. O posto1 legado NÃO será apagado. Continuar?`)) return;
  if(el) el.innerHTML=`<div style="margin-top:12px;color:var(--muted);font-size:12px">⏳ Gravando ${escHtml(N)} mês(es) + meta…</div>`;
  // GRAVAÇÃO atômica (writes-only numa runTransaction). plan.meta SEM schemaVersion.
  try{
    await runTransaction(db,async(tx)=>{
      for(const m of plan.meses){ tx.set(doc(db,"conciliacao",monthDocId(m.mes)),{sales:m.sales,bank:m.bank}); }
      tx.set(doc(db,"conciliacao",metaDocId),plan.meta);
    });
  }catch(e){
    console.error("[executeBackfill] falha na transação:",e?.code,e?.message);
    red(`Falha ao gravar: ${escHtml(e?.message||e?.code||"erro desconhecido")}. Nada confirmado.`);
    return;
  }
  // RELEITURA de verificação: getDoc de cada mês e confere contagens contra o plano.
  const divergencias=[];
  for(const m of plan.meses){
    try{
      const snap=await getDoc(doc(db,"conciliacao",monthDocId(m.mes)));
      const d=snap.exists()?snap.data():{};
      const gs=Array.isArray(d.sales)?d.sales.length:0;
      const gb=Array.isArray(d.bank)?d.bank.length:0;
      if(gs!==m.salesCount||gb!==m.bankCount) divergencias.push(`${m.mes}: gravado ${gs}v/${gb}c, esperado ${m.salesCount}v/${m.bankCount}c`);
    }catch(e){ divergencias.push(`${m.mes}: falha na releitura (${e?.code||e?.message||"erro"})`); }
  }
  if(divergencias.length){ red(`Verificação encontrou ${escHtml(divergencias.length)} mês(es) divergente(s): ${escHtml(divergencias.join("; "))}. Confira o Firestore antes de prosseguir.`); return; }
  // Trilha de auditoria (best-effort, fora da tx): registra o backfill.
  logAudit("backfill","posto1_meta+meses",{monthsCount:N,salesTotal:t.planSales,bankTotal:t.planBank});
  green(`Migração concluída: ${escHtml(N)} meses gravados, meta criada (schemaVersion ainda não ligado, modo paginado segue desligado até a Fase 5).`);
};

// Fase 5 (cutover): liga o modo paginado gravando schemaVersion:1 no posto1_meta.
// Protegido: só funciona se a Fase 4 real já rodou (meta existe c/ meses) e ainda
// não está ativo. Só toca o posto1_meta — NÃO toca posto1 legado nem posto1_m_*.
// Reversível (não apaga nada; remover o legado é a Fase 6). schemaVersion:1 fixo.
// NÃO força reload, NÃO muda STATE nem paginatedMode em memória — só vale no próximo
// boot. window.* (handler inline). Dados escapados via escHtml().
window.activatePaginatedMode=async function(){
  const el=document.getElementById("backfill-preview");
  const box=(bg,bd,fg,icon,msg)=>{ if(el) el.innerHTML=`<div class="alert-late" style="background:${bg};border-color:${bd};color:${fg};margin-top:12px">${icon} ${msg}</div>`; };
  const red=(msg)=>box("#1a0010","#e91e8c40","#f48fb1","⛔",msg);
  const amber=(msg)=>box("#1a1400","#d4a01740","#e6c34a","⚠️",msg);
  const green=(msg)=>box("#06160c","#1f7a3f","#7be0a3","✅",msg);
  const metaRef=doc(db,"conciliacao",metaDocId);
  // a. Lê o meta.
  let snap;
  try{ snap=await getDoc(metaRef); }
  catch(e){ red(`Falha ao ler meta: ${escHtml(e?.message||e?.code||"erro desconhecido")}.`); return; }
  // TRAVA A — meta não existe.
  if(!snap.exists()){ red("posto1_meta não encontrado. Rode a migração (Executar migração) primeiro."); return; }
  const meta=snap.data();
  // TRAVA B — sem meses.
  if(!Array.isArray(meta.months)||meta.months.length===0){ red("Meta sem meses. Migração incompleta ou banco vazio."); return; }
  // TRAVA C — já ativo.
  if(meta.schemaVersion){ amber(`Modo paginado já está ativo (schemaVersion=${escHtml(meta.schemaVersion)}). Nada a fazer.`); return; }
  // TRAVA D — confirmação.
  if(!confirm("Isto ativa o modo paginado no próximo carregamento. O app passará a ler os dados por mês; o posto1 legado vira fallback. Confirma?")) return;
  // GRAVAÇÃO: relê o meta na transação e regrava o objeto inteiro + schemaVersion:1.
  try{
    await runTransaction(db,async(tx)=>{
      const s=await tx.get(metaRef);
      const cur=s.exists()?s.data():{};
      tx.set(metaRef,{...cur,schemaVersion:1});
    });
  }catch(e){
    console.error("[activatePaginatedMode] falha:",e?.code,e?.message);
    red(`Falha ao ativar: ${escHtml(e?.message||e?.code||"erro desconhecido")}. Nada mudou.`);
    return;
  }
  // Trilha de auditoria (best-effort, fora da tx): registra o cutover.
  logAudit("cutover","posto1_meta",{schemaVersion:1});
  green("Modo paginado ATIVADO (schemaVersion=1). RECARREGUE a página para o app entrar no modo paginado. O posto1 legado continua intacto como fallback.");
};

// Recongela expectedDate de todas as vendas com a config atual (prazos/feriados).
window.recalcExpectedDates=function(){
  const n=STATE.sales.length;
  if(n===0){ alert("Nenhuma venda para recalcular."); return; }
  if(!confirm(`Recalcular a data de depósito de ${n} venda(s) com a config atual?\nIsso pode alterar o status de conciliação.`)) return;
  STATE.sales.forEach(s=>{ s.expectedDate=calcDeposit(s.date,s.modality); });
  saveToFirebase();
  alert(`✅ Datas recalculadas (${n} venda(s)).`);
};

window.addHoliday=function(){
  const v=document.getElementById("new-hol").value;
  if(!v||!/^\d{4}-\d{2}-\d{2}$/.test(v)||STATE.config.holidays.includes(v))return;
  STATE.config.holidays=[...STATE.config.holidays,v].sort();
  saveToFirebase();showMsg("hol-msg","✅ Adicionado!","ok");renderConfig();
};

window.removeHoliday=function(h){
  STATE.config.holidays=STATE.config.holidays.filter(x=>x!==h);
  saveToFirebase();renderConfig();
};

// ─── Backup JSON (somente leitura) ──────────────────────────────────────────
// Converte recursivamente Timestamps do Firestore (via .toDate() ou
// {seconds,nanoseconds}) em strings ISO. Neste projeto as datas já são strings
// (YYYY-MM-DD / ISO), então é efetivamente passthrough — mantido por paridade
// com os backups do Mahau-sistema e do Mahau-CRM.
function backupSerialize(v){
  if(v==null)return v;
  if(typeof v.toDate==="function"){ try{ return v.toDate().toISOString(); }catch(e){ return String(v); } }
  if(typeof v==="object"&&typeof v.seconds==="number"&&typeof v.nanoseconds==="number"){
    return new Date(v.seconds*1000+Math.round(v.nanoseconds/1e6)).toISOString();
  }
  if(Array.isArray(v))return v.map(backupSerialize);
  if(typeof v==="object"){ const o={}; for(const k in v)o[k]=backupSerialize(v[k]); return o; }
  return v;
}

// YYYY-MM-DD-HH-mm em horário local.
function backupStamp(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}-${p(d.getMinutes())}`;
}

window.exportBackupJSON=async function(){
  const btn=document.getElementById("backup-btn");
  const orig=btn?btn.textContent:"";
  if(btn){ btn.disabled=true; btn.textContent="⏳ Exportando..."; }
  try{
    // Lê fresco do Firestore (fonte da verdade), não da STATE em memória.
    const snap=await getDoc(doc(db,"conciliacao",DOC_ID));
    const data=snap.exists()?backupSerialize(snap.data()):{};
    const sales=Array.isArray(data.sales)?data.sales:[];
    const bank=Array.isArray(data.bank)?data.bank:[];

    const backup={
      exported_at:new Date().toISOString(),
      project:"conciliacao-posto",
      version:1,
      counts:{ documentos:snap.exists()?1:0, vendas:sales.length, extrato:bank.length },
      collections:{ conciliacao:{ [DOC_ID]:data } }
    };

    const json=JSON.stringify(backup,null,2);
    const url=URL.createObjectURL(new Blob([json],{type:"application/json"}));
    const a=document.createElement("a");
    a.href=url;
    a.download=`conciliacao-posto-backup-${backupStamp()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    const total=backup.counts.vendas+backup.counts.extrato;
    showMsg("backup-msg",`✅ Backup gerado: ${backup.counts.vendas} venda(s) + ${backup.counts.extrato} entrada(s) = ${total} registro(s).`,"ok");
  }catch(e){
    console.error("[exportBackupJSON] falha:",e);
    showMsg("backup-msg","Erro ao gerar backup: "+(e?.message||e),"err");
  }finally{
    if(btn){ btn.disabled=false; btn.textContent=orig; }
  }
};

window.doImport=function(){
  const msgEl=document.getElementById("import-msg");
  function importErr(msg){ msgEl.innerHTML=""; const s=document.createElement("span"); s.className="msg-err"; s.textContent=msg; msgEl.appendChild(s); }
  try{
    const d=JSON.parse(document.getElementById("import-text").value);
    if(typeof d!=="object"||d===null||Array.isArray(d)) throw new Error("formato inválido");
    // Valida TUDO antes de tocar no STATE (atômico): se algo falhar, nada é aplicado.
    let newSales,newBank;
    if(d.sales!==undefined){
      if(!Array.isArray(d.sales)) throw new Error("campo sales inválido");
      if(d.sales.length>50000) throw new Error("muitos registros");
      newSales=d.sales.map((s,i)=>normSale(s,i)); // 2 args (remote=undefined → regenera id). fail-fast: lança no 1º inválido
    }
    if(d.bank!==undefined){
      if(!Array.isArray(d.bank)) throw new Error("campo bank inválido");
      if(d.bank.length>50000) throw new Error("muitos registros");
      newBank=d.bank.map((e,i)=>normBank(e,i)); // 2 args (remote=undefined → regenera id)
    }
    // Tudo validou — agora aplica.
    if(newSales!==undefined) STATE.sales=newSales;
    if(newBank!==undefined) STATE.bank=newBank;
    if(isPlainObject(d.mdr))STATE.mdr=sanitizeMdr({...DEFAULT_MDR,...d.mdr});
    if(isPlainObject(d.config))STATE.config=sanitizeConfig({...DEFAULT_CONFIG,...d.config});
    saveToFirebase();
    document.getElementById("import-text").value="";
    closeModal("import-modal");
    renderCurrentTab();
    alert("✅ Dados importados!");
  }catch(e){ importErr("Texto inválido: "+e.message); }
};

window.closeModal=function(id){document.getElementById(id).style.display="none";};

// ─── Confirmação destrutiva ───────────────────────────────────────────────────
let _confirmCb=null;

window.confirmarLimpar=function(msg,callback){
  _confirmCb=callback;
  document.getElementById("confirm-msg").textContent=msg;
  const inp=document.getElementById("confirm-input");
  inp.value="";
  const btn=document.getElementById("confirm-ok-btn");
  btn.disabled=true; btn.style.opacity=".35"; btn.style.cursor="not-allowed";
  document.getElementById("confirm-modal").style.display="flex";
  setTimeout(()=>inp.focus(),60);
};

window.checkConfirmInput=function(){
  const ok=document.getElementById("confirm-input").value==="LIMPAR";
  const btn=document.getElementById("confirm-ok-btn");
  btn.disabled=!ok;
  btn.style.opacity=ok?"1":".35";
  btn.style.cursor=ok?"pointer":"not-allowed";
};

window.doConfirmAction=function(){
  if(document.getElementById("confirm-input").value!=="LIMPAR") return;
  const cb=_confirmCb;   // captura antes: closeConfirmModal() zera _confirmCb
  closeConfirmModal();
  if(cb) cb();
};

window.closeConfirmModal=function(){
  document.getElementById("confirm-modal").style.display="none";
  _confirmCb=null;
};

// ─── Helpers UI ───────────────────────────────────────────────────────────────
function showMsg(id,text,type){
  const el=document.getElementById(id);
  if(!el)return;
  el.innerHTML="";
  const span=document.createElement("span");
  span.className="msg-"+type;
  span.textContent=text;
  el.appendChild(span);
  setTimeout(()=>{ if(el)el.innerHTML=""; },2500);
}
