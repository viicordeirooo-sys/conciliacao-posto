window.runDebugPDF=function(input){
  var file=input.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var loadPdfJs=function(){
      return new Promise(function(res,rej){
        if(window.pdfjsLib){res();return;}
        var s=document.createElement("script");
        s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
        s.onload=function(){
          window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
          res();
        };
        s.onerror=rej;
        document.head.appendChild(s);
      });
    };
    loadPdfJs().then(function(){
      return pdfjsLib.getDocument({data:e.target.result}).promise;
    }).then(function(pdf){
      var pages=Math.min(2,pdf.numPages);
      var results=[];
      var getPage=function(i){
        if(i>pages){
          var box=document.getElementById("pdf-debug");
          var ta=document.getElementById("pdf-debug-text");
          var btn=document.getElementById("copy-debug-btn");
          if(box) box.style.display="block";
          if(ta) ta.value=results.join("\n").slice(0,3000);
          if(btn) btn.onclick=function(){
            var t=document.getElementById("pdf-debug-text");
            if(t) navigator.clipboard.writeText(t.value).then(function(){alert("Copiado!");});
          };
          return;
        }
        pdf.getPage(i).then(function(page){
          return page.getTextContent();
        }).then(function(content){
          results.push("=== PAG "+i+" ===");
          content.items.forEach(function(item,idx){
            if(item.str && item.str.trim()) results.push("["+idx+"] "+item.str);
          });
          getPage(i+1);
        });
      };
      getPage(1);
    }).catch(function(err){
      alert("Erro PDF: "+err.message);
    });
    input.value="";
  };
  reader.readAsArrayBuffer(file);
};

// Normaliza texto de cabeçalho: minúsculas, sem acento. "Descrição" -> "descricao".
function _normHdr(s){ return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim(); }

// Detecta a linha de cabeçalho e mapeia colunas por NOME (não por posição fixa).
// Essenciais: Data + Entradas (sinônimos Crédito/Valor). Tipo/Descrição opcionais.
// Retorna {headerRow,data,tipo,descricao,entradas} ou null se não reconhecer.
function mapXlsxColumns(rows){
  const VAL_SYN=["entradas","credito","valor"]; // prioridade: entradas > credito > valor
  const lim=Math.min(rows.length,50);
  for(let r=0;r<lim;r++){
    const normd=(rows[r]||[]).map(_normHdr);
    const data=normd.indexOf("data");
    let entradas=-1;
    for(const syn of VAL_SYN){ const c=normd.indexOf(syn); if(c>=0){ entradas=c; break; } }
    if(data>=0 && entradas>=0){
      return {headerRow:r,data,tipo:normd.indexOf("tipo"),descricao:normd.indexOf("descricao"),entradas};
    }
  }
  return null;
}

// Processa as linhas de dados do extrato usando o mapa de colunas. Puro/testável.
function parseXlsxBankRows(rows,map){
  const imported=[]; let skipped=0;
  for(let i=map.headerRow+1;i<rows.length;i++){
    const row=rows[i]||[];
    const dateRaw=row[map.data];
    const tipo=map.tipo>=0?String(row[map.tipo]||"").trim():"";
    const desc=map.descricao>=0?String(row[map.descricao]||"").trim():"";
    const rawVal=row[map.entradas];
    if(!dateRaw) continue;                              // linha vazia, ignora
    if(tipo.toLowerCase().includes("saldo")) continue;  // linha de saldo, ignora
    const entradas=parseBRLNumber(rawVal);
    if(!Number.isFinite(entradas)||entradas<=0){
      if(rawVal!==""&&rawVal!=null) skipped++;          // havia valor mas não parseou
      continue;
    }
    let isoDate="";
    if(typeof dateRaw==="string"&&dateRaw.includes("/")){
      const[d,m,y]=dateRaw.split("/");
      isoDate=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    } else if(typeof dateRaw==="number"){
      const jsDate=new Date((dateRaw-25569)*86400*1000); // serial Excel
      isoDate=jsDate.toISOString().slice(0,10);
    } else { skipped++; continue; }
    const extId=`bk_${isoDate}_${desc}_${entradas}`.replace(/\s/g,'_');
    imported.push({id:uid(),extId,date:isoDate,description:desc,amount:entradas});
  }
  return {imported,skipped};
}

// ── Importador xlsx "Agenda de Vendas" SafraPay (Bloco 3) — puros/testáveis ──────
// Prazo de liquidação (dias úteis) de um subtipo: perfil.vendas.liquidacao vence;
// senão cai no fallback de código SAFRA_LIQ.
function safraPrazo(liqKey,profile){
  const d=profile?.vendas?.liquidacao?.[liqKey]?.d;
  return Number.isFinite(d)?d:(SAFRA_LIQ[liqKey]??1);
}
// Detecta o cabeçalho pela linha que contém "data da venda" (NÃO hardcode linha 7)
// e mapeia colunas por nome normalizado. Exige data+modalidade+bruto.
function mapSafraVendasColumns(rows){
  const lim=Math.min(rows.length,50);
  for(let r=0;r<lim;r++){
    const normd=(rows[r]||[]).map(_normHdr);
    const find=(...names)=>{ for(const n of names){ const c=normd.findIndex(h=>h.includes(n)); if(c>=0)return c; } return -1; };
    const dataVenda=find("data da venda"), modalidade=find("modalidade"), valorBruto=find("valor bruto");
    if(dataVenda>=0&&modalidade>=0&&valorBruto>=0){
      return { headerRow:r, dataVenda, modalidade, valorBruto,
        valorLiquido:find("valor liquido"), bandeira:find("bandeira","arranjo"), nsu:find("nsu","sequencial"), parcela:find("parcela") };
    }
  }
  return null;
}
// Modalidade SafraPay → {modality (∈MODALITIES), sub, liqKey}. Ordem: pré-pago ANTES
// de débito/crédito puros. Crédito parcelado por Parcela (dado real só tem "(1)").
// Desconhecida → null (o chamador PULA; nunca chuta modalidade).
function mapSafraModalidade(modStr,parcela){
  const t=_normHdr(modStr);
  if(t.includes("pre")&&t.includes("cred")) return {modality:"Crédito À Vista",sub:"prepago_cred",liqKey:"prepago_cred"};
  if(t.includes("pre")&&t.includes("deb"))  return {modality:"Débito",sub:"prepago_deb",liqKey:"prepago_deb"};
  if(t.includes("instant")||t==="pix")      return {modality:"Pix",sub:"",liqKey:"pix"};
  if(t.includes("cred")){
    const n=parseInt(String(parcela==null?"":parcela).replace(/\D/g,""),10)||1;
    const modality=n>=7?"Crédito 7–12x":n>=2?"Crédito 2–6x":"Crédito À Vista";
    return {modality,sub:"",liqKey:"credito"};
  }
  if(t.includes("deb")) return {modality:"Débito",sub:"",liqKey:"debito"};
  return null;
}
// Bandeira/Arranjo SafraPay → BANDEIRA (nível marca; o 4c casa por VALOR, não parseia
// arranjo). Electron→Visa, Maestro/Redeshop→Mastercard, etc.
function mapSafraBandeira(arr){
  const t=_normHdr(arr);
  if(t.includes("visa")||t.includes("electron")) return "Visa";
  if(t.includes("master")||t.includes("maestro")||t.includes("redeshop")) return "Mastercard";
  if(t.includes("elo")) return "Elo";
  if(t.includes("hiper")) return "Hipercard";
  if(t.includes("amex")||t.includes("american")) return "Amex";
  if(t.includes("pix")) return "Pix";
  return "Outro";
}
// Linhas de dados → vendas normalizadas (mesma forma do lançamento manual/PDF).
// Guarda bruto (amount) E líquido (liquidoReal). expectedDate CONGELADO via prazo do
// perfil. sub só p/ pré-pago. extId sp_<iso>_<nsu>_<bruto> (NSU dá dedupe forte).
function parseSafraVendasRows(rows,map,profile){
  const imported=[]; let skipped=0; const suspeitos=[];
  const holidays=STATE.config.holidays;
  for(let i=map.headerRow+1;i<rows.length;i++){
    const row=rows[i]||[];
    const dateRaw=row[map.dataVenda];
    if(dateRaw===""||dateRaw==null) continue;             // linha vazia
    let iso="";
    if(typeof dateRaw==="string"&&dateRaw.includes("/")){
      const[d,m,y]=dateRaw.split(/[\/ ]/);
      if(d&&m&&y) iso=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    } else if(typeof dateRaw==="number"){
      iso=new Date((dateRaw-25569)*86400*1000).toISOString().slice(0,10);   // serial Excel
    }
    if(!_DATE_RE.test(iso)||isNaN(new Date(iso+"T12:00:00"))){ skipped++; continue; }
    const bruto=parseBRLNumber(row[map.valorBruto]);
    if(!Number.isFinite(bruto)||bruto<=0||bruto>9999999){ skipped++; continue; }
    const mod=mapSafraModalidade(row[map.modalidade],map.parcela>=0?row[map.parcela]:"");
    if(!mod){ skipped++; continue; }                      // modalidade desconhecida → nunca chuta
    const bandeira=mod.liqKey==="pix"?"Pix":mapSafraBandeira(map.bandeira>=0?row[map.bandeira]:"");
    const nsu=map.nsu>=0?String(row[map.nsu]||"").trim():"";
    const expectedDate=addBusinessDays(iso,safraPrazo(mod.liqKey,profile),holidays);
    const sale={id:uid(),extId:`sp_${iso}_${nsu}_${bruto}`.replace(/\s/g,"_"),date:iso,bandeira,modality:mod.modality,amount:bruto,expectedDate};
    if(mod.sub) sale.sub=mod.sub;
    const liq=map.valorLiquido>=0?parseBRLNumber(row[map.valorLiquido]):NaN;
    if(Number.isFinite(liq)&&liq>=0&&liq<=bruto){ sale.liquidoReal=liq; }
    else if(map.valorLiquido>=0){ sale._suspeito=true; suspeitos.push({date:iso,amount:bruto,motivo:"líquido ausente/fora de faixa"}); }
    imported.push(sale);
  }
  return {imported,skipped,suspeitos};
}

// ── Parser do PDF do extrato Banco Safra (Bloco 2) — puros/testáveis ────────────
// pdfmake gera camada de texto limpa. Reconstrói LINHAS por posição: agrupa itens
// do pdf.js por y (arredondado), ordena por x. Diferente do PagBank (dump [n]).
function reconstructPdfLines(items){
  const byY=new Map();
  items.forEach(it=>{ if(!it.str||!it.str.trim())return; const y=Math.round(it.transform[5]); const x=it.transform[4]; if(!byY.has(y))byY.set(y,[]); byY.get(y).push({x,str:it.str.trim()}); });
  return [...byY.entries()].sort((a,b)=>b[0]-a[0]).map(([y,arr])=>({y,items:arr.sort((a,b)=>a.x-b.x)}));
}
const _SAFRA_MONEY=/^-?\d{1,3}(\.\d{3})*,\d{2}$/, _SAFRA_DDMM=/^(\d{2})\/(\d{2})$/;
// Ano do extrato via "Período de dd/mm/yyyy a dd/mm/yyyy". Trata virada de ano por mês.
function _safraDerivePeriodo(lines){
  for(const ln of lines){ const s=ln.items.map(t=>t.str).join(" "); const m=s.match(/(\d{2})\/(\d{2})\/(\d{4}).*?(\d{2})\/(\d{2})\/(\d{4})/); if(m) return {sM:+m[2],sY:+m[3],eM:+m[5],eY:+m[6]}; }
  return null;
}
function _safraYearFor(mm,per){ if(!per) return new Date().getFullYear(); if(per.sY===per.eY) return per.sY; return (mm>=per.sM)?per.sY:per.eY; }
// Linhas reconstruídas → créditos (armazenados) + contagem de débitos/tarifas (v1: só
// crédito é armazenado). Rules: (a) data em x<50 + valor em x>420; (b) linha sem os
// dois = continuação → pula; (c) SALDO TOTAL/INICIAL descartado; (d) NÃO usa a coluna
// Nº Documento (nome longo não quebra — âncora só em data-início/valor-fim).
function parseSafraExtratoPDF(lines,profile){
  const per=_safraDerivePeriodo(lines);
  const imported=[]; let skipped=0; const seqDia={};
  const debitos={count:0,total:0}; const tarifas={count:0,total:0}; const byCat={};
  for(const ln of lines){
    const dateItem=ln.items.find(t=>t.x<50 && _SAFRA_DDMM.test(t.str));
    const valItem=[...ln.items].reverse().find(t=>t.x>420 && _SAFRA_MONEY.test(t.str));
    if(!dateItem||!valItem) continue;                          // (a)/(b)
    const lanc=ln.items.filter(t=>t.x>=55&&t.x<244).map(t=>t.str).join(" ").trim();
    if(/^saldo/i.test(lanc)) continue;                          // (c)
    const comp=ln.items.filter(t=>t.x>=244&&t.x<420).map(t=>t.str).join(" ").trim();
    const value=parseBRLNumber(valItem.str);
    if(!Number.isFinite(value)){ skipped++; continue; }
    const dm=dateItem.str.match(_SAFRA_DDMM), dd=dm[1], mm=dm[2];
    const iso=`${_safraYearFor(+mm,per)}-${mm}-${dd}`;
    const description=(lanc+" "+comp).replace(/\s+/g," ").trim().slice(0,200);
    const cat=classifyBank(description,profile);
    byCat[cat]=(byCat[cat]||0)+1;
    if(value>0){
      const s=(seqDia[iso]=(seqDia[iso]||0)+1)-1;               // seq POR DIA (idempotente em re-import)
      imported.push({id:uid(),extId:`safra_${iso}_${s}_${value}`,date:iso,description,amount:value});
    } else if(value<0){
      debitos.count++; debitos.total=round2(debitos.total+value);
      if(cat==="tarifa"){ tarifas.count++; tarifas.total=round2(tarifas.total+value); }
    } else { skipped++; }
  }
  return {imported,skipped,debitos,tarifas,byCat};
}

// XLSX importer for PagBank bank statement
window.importXLSX=function(input){
  const file=input.files[0]; if(!file) return;
  const validXlsxTypes=["application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","application/vnd.ms-excel"];
  if(file.type&&!validXlsxTypes.includes(file.type)&&!file.name.toLowerCase().match(/\.(xlsx|xls)$/)){
    showMsg("extrato-msg","Arquivo inválido. Selecione um XLSX.","err");
    input.value=""; return;
  }
  if(file.size>MAX_FILE_SIZE){
    showMsg("extrato-msg","Arquivo muito grande (máx. 10 MB).","err");
    input.value=""; return;
  }
  showMsg("extrato-msg","⏳ Lendo XLSX...","ok");
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      if(!window.XLSX){
        await new Promise((res,rej)=>{
          const s=document.createElement('script');
          s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
          s.onload=res; s.onerror=rej;
          document.head.appendChild(s);
        });
      }
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});

      // Detecta o cabeçalho dinamicamente e mapeia colunas por nome (leiaute do
      // PagBank pode variar nº de linhas de metadados / posição das colunas).
      const map=mapXlsxColumns(rows);
      if(!map){
        showMsg("extrato-msg",'Cabeçalho não reconhecido — esperado uma linha com "Data" e "Entradas". Confira o arquivo.',"err");
        input.value=""; return;
      }
      const {imported,skipped}=parseXlsxBankRows(rows,map);

      if(imported.length===0){
        showMsg("extrato-msg",skipped>0?`Nenhuma entrada válida. ${skipped} linha(s) ignorada(s) — confira o leiaute do arquivo.`:"Nenhuma entrada encontrada no arquivo.","err");
        return;
      }
      const existingIds=new Set(STATE.bank.map(e=>e.extId).filter(Boolean));
      const news=imported.filter(e=>!existingIds.has(e.extId));
      STATE.bank=[...news,...STATE.bank];
      saveToFirebase();
      if(skipped>0) console.warn(`[importXLSX] ${skipped} linha(s) ignorada(s) por valor/data não-parseável.`);
      const skipMsg=skipped>0?`, ${skipped} ignorada(s)`:"";
      showMsg("extrato-msg",`✅ ${news.length} entradas importadas! (${imported.length-news.length} duplicatas${skipMsg})`,"ok");
      renderExtrato();
    }catch(err){
      showMsg("extrato-msg","Erro ao ler XLSX: "+err.message,"err");
    }
    input.value="";
  };
  reader.readAsArrayBuffer(file);
};

// XLSX importer for SafraPay "Agenda de Vendas" (vendas). Espelha importXLSX:
// carrega SheetJS, mapeia cabeçalho, parseia, dedupe por extId (sp_…, NSU forte).
window.importVendasSafraXLSX=function(input){
  const file=input.files[0]; if(!file) return;
  const validXlsxTypes=["application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","application/vnd.ms-excel"];
  if(file.type&&!validXlsxTypes.includes(file.type)&&!file.name.toLowerCase().match(/\.(xlsx|xls)$/)){
    showMsg("venda-msg","Arquivo inválido. Selecione um XLSX.","err");
    input.value=""; return;
  }
  if(file.size>MAX_FILE_SIZE){
    showMsg("venda-msg","Arquivo muito grande (máx. 10 MB).","err");
    input.value=""; return;
  }
  showMsg("venda-msg","⏳ Lendo XLSX SafraPay...","ok");
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      if(!window.XLSX){
        await new Promise((res,rej)=>{
          const s=document.createElement('script');
          s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
          s.onload=res; s.onerror=rej;
          document.head.appendChild(s);
        });
      }
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      const map=mapSafraVendasColumns(rows);
      if(!map){
        showMsg("venda-msg",'Cabeçalho não reconhecido — esperado uma linha com "Data da Venda", "Modalidade" e "Valor Bruto".',"err");
        input.value=""; return;
      }
      const noLiq=map.valorLiquido<0;
      const {imported,skipped,suspeitos}=parseSafraVendasRows(rows,map,profileFor(STATE.config));
      if(imported.length===0){
        showMsg("venda-msg",skipped>0?`Nenhuma venda válida. ${skipped} linha(s) ignorada(s) — confira o leiaute.`:"Nenhuma venda encontrada no arquivo.","err");
        input.value=""; return;
      }
      const existingIds=new Set(STATE.sales.map(s=>s.extId).filter(Boolean));
      const news=imported.filter(s=>!existingIds.has(s.extId));
      STATE.sales=[...news,...STATE.sales];
      saveToFirebase();
      if(skipped>0) console.warn(`[importVendasSafraXLSX] ${skipped} linha(s) ignorada(s) por data/valor/modalidade.`);
      const skipMsg=skipped>0?`, ${skipped} ignorada(s)`:"";
      renderVendas();
      // showMsg DEPOIS do renderVendas (reconstrói #venda-msg), como no importPDF/importXLSX.
      showMsg("venda-msg",`✅ ${news.length} vendas importadas! (${imported.length-news.length} duplicatas${skipMsg})`,"ok");
      // AVISO de sanidade: coluna de líquido ausente OU linhas sem líquido válido →
      // essas vendas caem no MDR de config (fallback), não no líquido real do SafraPay.
      const susps=noLiq?[]:(suspeitos||[]);
      const pv=document.getElementById("venda-preview");
      if(pv&&(noLiq||susps.length>0)){
        const cab=noLiq
          ? `⚠️ <strong>Coluna "Valor Líquido" não encontrada</strong> — as vendas usarão o MDR da Config (fallback), não o líquido real do SafraPay. O matching de cartão (Σ líquido) pode divergir.`
          : `⚠️ <strong>${susps.length} de ${imported.length} vendas sem líquido válido</strong> — usarão o MDR da Config (fallback).`;
        const lim=susps.slice(0,10).map(s=>`<div>• ${escHtml(s.date)} — ${fmtBRL(s.amount)} — ${escHtml(s.motivo)}</div>`).join("");
        const mais=susps.length>10?`<div style="margin-top:4px">(+${susps.length-10} mais)</div>`:"";
        pv.innerHTML=`<div class="alert-late" style="background:#1a1400;border-color:#d4a01740;color:#e6c34a">${cab}<div style="margin-top:8px;font-size:11px;line-height:1.6">${lim}${mais}</div></div>`;
      }
    }catch(err){
      showMsg("venda-msg","Erro ao ler XLSX: "+err.message,"err");
    }
    input.value="";
  };
  reader.readAsArrayBuffer(file);
};

// PDF importer for Banco Safra bank statement (extrato). Espelha importPDF no
// carregamento do pdf.js; reconstrói linhas por posição e chama parseSafraExtratoPDF.
window.importExtratoSafraPDF=function(input){
  const file=input.files[0]; if(!file) return;
  if(file.type&&file.type!=="application/pdf"){
    showMsg("extrato-msg","Arquivo inválido. Selecione um PDF.","err");
    input.value=""; return;
  }
  if(file.size>MAX_FILE_SIZE){
    showMsg("extrato-msg","Arquivo muito grande (máx. 10 MB).","err");
    input.value=""; return;
  }
  showMsg("extrato-msg","⏳ Lendo PDF Safra...","ok");
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      if(!window.pdfjsLib){
        await new Promise((res,rej)=>{
          const s=document.createElement('script');
          s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
          s.onload=res; s.onerror=rej;
          document.head.appendChild(s);
        });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
      const pdf=await pdfjsLib.getDocument({data:e.target.result}).promise;
      const lines=[];
      for(let i=1;i<=pdf.numPages;i++){
        const page=await pdf.getPage(i);
        const content=await page.getTextContent();
        lines.push(...reconstructPdfLines(content.items));
      }
      const {imported,skipped,debitos,tarifas}=parseSafraExtratoPDF(lines,profileFor(STATE.config));
      if(imported.length===0){
        showMsg("extrato-msg",skipped>0?`Nenhum crédito válido. ${skipped} linha(s) ambígua(s) — confira o leiaute do PDF.`:"Nenhum lançamento de crédito encontrado no PDF.","err");
        input.value=""; return;
      }
      const existingIds=new Set(STATE.bank.map(e=>e.extId).filter(Boolean));
      const news=imported.filter(e=>!existingIds.has(e.extId));
      STATE.bank=[...news,...STATE.bank];
      saveToFirebase();
      if(skipped>0) console.warn(`[importExtratoSafraPDF] ${skipped} linha(s) ambígua(s) ignorada(s).`);
      renderExtrato();
      // Resumo pós-import (nada de balde silencioso): créditos + débitos ignorados (v1)
      // com contagem de tarifas Pix separada.
      const dbg=debitos.count>0?` ${debitos.count} débito(s) ignorado(s) (${fmtBRL(debitos.total)}), inclui ${tarifas.count} tarifa(s) Pix.`:"";
      showMsg("extrato-msg",`✅ ${news.length} créditos importados! (${imported.length-news.length} duplicatas)${dbg}`,"ok");
    }catch(err){
      showMsg("extrato-msg","Erro ao ler PDF: "+err.message,"err");
    }
    input.value="";
  };
  reader.readAsArrayBuffer(file);
};

window.deleteBank=function(id){
  const e=STATE.bank.find(x=>x.id===id);

    STATE.bank=STATE.bank.filter(x=>x.id!==id);

  });
};

  });
};

// ─── RESUMO ───────────────────────────────────────────────────────────────────
let resumoMonth="";

function renderResumo(){
  const enriched=STATE.sales.map(enrichSale);
  const months=paginatedMode?availableMonths():[...new Set(enriched.map(s=>monthKey(s.date)))].sort().reverse();
  if(!resumoMonth&&months.length)resumoMonth=months[0];

  const ms=enriched.filter(s=>monthKey(s.date)===resumoMonth);
  const rec=getReconciliation().filter(r=>monthKey(r.date)===resumoMonth);

  const totalBruto=ms.reduce((a,s)=>a+s.bruto,0);
  const totalMDR=ms.reduce((a,s)=>a+s.custoMDR,0);
  const totalLiquido=ms.reduce((a,s)=>a+s.liquido,0);
  const totalBanco=STATE.bank.filter(e=>monthKey(e.date)===resumoMonth).reduce((a,e)=>a+Number(e.amount),0);
  const taxaEf=totalBruto>0?totalMDR/totalBruto:0;
  const diff=totalBanco-totalLiquido;

  // Por bandeira
  const pb={};
  ms.forEach(s=>{
    if(!pb[s.bandeira])pb[s.bandeira]={bruto:0,mdr:0,liquido:0,count:0};
    pb[s.bandeira].bruto+=s.bruto;pb[s.bandeira].mdr+=s.custoMDR;
    pb[s.bandeira].liquido+=s.liquido;pb[s.bandeira].count++;
  });
  const bandRows=Object.entries(pb).sort((a,b)=>b[1].bruto-a[1].bruto).map(([b,v])=>`<tr>
    <td style="font-weight:700">${escHtml(b)}</td>
    <td>${v.count}</td>
    <td style="color:var(--purple)">${fmtBRL(v.bruto)}</td>
    <td style="color:var(--red);font-size:11px">${fmtBRL(v.mdr)}</td>
    <td style="color:var(--green);font-weight:600">${fmtBRL(v.liquido)}</td>
    <td style="color:var(--muted);font-size:11px">${totalBruto>0?pct(v.mdr/v.bruto*100):"0.00%"}</td>
  </tr>`).join("");

  const statusMap={conciliado:["var(--green)","✅ Conciliado"],divergencia:["var(--accent)","⚠️ Divergência"],atrasado:["var(--pink)","🚨 Atrasado"],em_aberto:["var(--red)","❌ Em Aberto"],a_vencer:["var(--blue)","⏳ A Vencer"],sem_venda:["#9b59b6","💰 Banco s/ venda"]};
  const statusCards=Object.entries(statusMap).map(([k,[color,label]])=>{
    const count=rec.filter(r=>r.status===k).length;
    return `<div style="background:var(--card2);border-radius:10px;padding:12px 16px;flex:1;min-width:90px;text-align:center;border-left:3px solid ${color}">
      <div style="font-family:var(--display);font-size:20px;font-weight:800;color:${color}">${count}</div>
      <div style="font-size:10px;color:var(--muted)">${label}</div>
    </div>`;
  }).join("");

  const monthOpts=months.map(m=>`<option value="${m}"${resumoMonth===m?"selected":""}>${monthLabel(m)}</option>`).join("");

  // MDR consolidado — mesma lógica de pb, mas sobre TODAS as vendas carregadas em
  // memória (enriched), não só o mês. Fonte-chave da taxa efetiva p/ renegociação.
  // loadedMonths reflete os meses REALMENTE presentes em STATE.sales (no paginado
  // só os do lookback); availableMonths()/months listaria o índice inteiro.
  const loadedMonths=[...new Set(enriched.map(s=>monthKey(s.date)))];
  const pbAll={};
  let realCount=0;
  enriched.forEach(s=>{
    if(!pbAll[s.bandeira])pbAll[s.bandeira]={bruto:0,mdr:0,liquido:0,count:0};
    pbAll[s.bandeira].bruto+=s.bruto;pbAll[s.bandeira].mdr+=s.custoMDR;
    pbAll[s.bandeira].liquido+=s.liquido;pbAll[s.bandeira].count++;
    if(s.taxaSource==="real")realCount++;
  });
  const totBrutoAll=enriched.reduce((a,s)=>a+s.bruto,0);
  const totMdrAll=enriched.reduce((a,s)=>a+s.custoMDR,0);
  const totLiqAll=enriched.reduce((a,s)=>a+s.liquido,0);
  const taxaEfAll=totBrutoAll>0?totMdrAll/totBrutoAll:0;
  const consRows=Object.entries(pbAll).sort((a,b)=>b[1].bruto-a[1].bruto).map(([b,v])=>`<tr>
    <td style="font-weight:700">${escHtml(b)}</td>
    <td>${v.count}</td>
    <td style="color:var(--purple)">${fmtBRL(v.bruto)}</td>
    <td style="color:var(--red);font-size:11px">${fmtBRL(v.mdr)}</td>
    <td style="color:var(--green);font-weight:600">${fmtBRL(v.liquido)}</td>
    <td style="color:var(--muted);font-size:11px">${v.bruto>0?pct(v.mdr/v.bruto*100):"0.00%"}</td>
  </tr>`).join("");
  const consTotalRow=`<tr style="border-top:2px solid var(--border)">
    <td style="font-weight:800">TOTAL</td>
    <td style="font-weight:800">${enriched.length}</td>
    <td style="color:var(--purple);font-weight:800">${fmtBRL(totBrutoAll)}</td>
    <td style="color:var(--red);font-weight:800">${fmtBRL(totMdrAll)}</td>
    <td style="color:var(--green);font-weight:800">${fmtBRL(totLiqAll)}</td>
    <td style="color:var(--accent);font-weight:800">${totBrutoAll>0?pct(taxaEfAll*100):"0.00%"}</td>
  </tr>`;
  const consAviso=paginatedMode?`
    <div class="alert-late" style="background:#3a2800;border-color:#f0a50040;color:#f0a500">⚠️ <strong>Modo paginado ativo</strong> — consolidado cobre apenas os ${loadedMonths.length} mês(es) carregado(s) em memória. Para a visão completa, navegue pelos meses no filtro acima (cada um fica em cache) ou use Exportar Backup na Config.</div>
  `:"";
  const realNote=realCount>0?`<div class="stat-sub" style="margin-top:8px">Base do MDR: ${realCount} de ${enriched.length} vendas com líquido real do extrato; as demais estimadas pela taxa configurada.</div>`:"";

  document.getElementById("tab-resumo").innerHTML=`
    <div class="card" style="padding:12px 16px;margin-bottom:14px">
      <div style="display:flex;gap:10px;align-items:center">
        <span class="sec-title" style="margin:0">Mês:</span>
        <select style="width:130px" onchange="setResumoMonth(this.value)">
          ${months.length===0?`<option>Sem dados</option>`:""}${monthOpts}
        </select>
      </div>
    </div>
    <div class="resumo-grid">
      <div class="stat-card" style="border-color:var(--purple)"><div class="stat-label">Total Bruto</div><div class="stat-value" style="color:var(--purple);font-size:16px">${fmtBRL(totalBruto)}</div></div>
      <div class="stat-card" style="border-color:var(--red)"><div class="stat-label">Custo MDR</div><div class="stat-value" style="color:var(--red);font-size:16px">${fmtBRL(totalMDR)}</div><div class="stat-sub">Taxa efetiva: ${pct(taxaEf*100)}</div></div>
      <div class="stat-card" style="border-color:var(--green)"><div class="stat-label">Líquido Esperado</div><div class="stat-value" style="color:var(--green);font-size:16px">${fmtBRL(totalLiquido)}</div></div>
      <div class="stat-card" style="border-color:var(--blue)"><div class="stat-label">Entrou no Banco</div><div class="stat-value" style="color:var(--blue);font-size:16px">${fmtBRL(totalBanco)}</div></div>
      <div class="stat-card" style="border-color:${Math.abs(diff)<1?"var(--green)":"var(--accent)"}"><div class="stat-label">Diferença</div><div class="stat-value" style="color:${Math.abs(diff)<1?"var(--green)":"var(--accent)"};font-size:16px">${fmtBRL(diff)}</div></div>
      <div class="stat-card" style="border-color:var(--muted)"><div class="stat-label">Transações</div><div class="stat-value" style="color:var(--muted)">${ms.length}</div></div>
    </div>
    <div class="card">
      <div class="sec-title">Por Bandeira — ${monthLabel(resumoMonth)}</div>
      ${ms.length===0?`<div class="empty">Sem vendas neste mês.</div>`:`
      <div class="table-wrap">
        <table>
          <thead><tr><th>Bandeira</th><th>Qtd</th><th>Bruto</th><th>MDR</th><th>Líquido</th><th>Taxa Ef.</th></tr></thead>
          <tbody>${bandRows}</tbody>
        </table>
      </div>`}
    </div>
    <div class="card">
      <div class="sec-title">MDR Consolidado — todos os meses carregados</div>
      ${consAviso}
      ${enriched.length===0?`<div class="empty">Sem vendas carregadas.</div>`:`
      <div class="table-wrap">
        <table>
          <thead><tr><th>Bandeira</th><th>Qtd</th><th>Bruto</th><th>MDR</th><th>Líquido</th><th>Taxa Ef.</th></tr></thead>
          <tbody>${consRows}${consTotalRow}</tbody>
        </table>
      </div>
      ${realNote}`}
    </div>
    <div class="card">
      <div class="sec-title">Status de Conciliação — ${monthLabel(resumoMonth)}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${statusCards}</div>
    </div>
  `;
}

// Recongela expectedDate de todas as vendas com a config atual (prazos/feriados).
window.recalcExpectedDates=function(){
  const n=STATE.sales.length;
  if(n===0){ alert("Nenhuma venda para recalcular."); return; }
  if(!confirm(`Recalcular a data de depósito de ${n} venda(s) com a config atual?\nIsso pode alterar o status de conciliação.`)) return;
  STATE.sales.forEach(s=>{ s.expectedDate=calcDeposit(s.date,s.modality); });
  saveToFirebase();
  alert(`✅ Datas recalculadas (${n} venda(s)).`);
};

window.addHoliday=function(){
  const v=document.getElementById("new-hol").value;
  if(!v||!/^\d{4}-\d{2}-\d{2}$/.test(v)||STATE.config.holidays.includes(v))return;
  STATE.config.holidays=[...STATE.config.holidays,v].sort();
  saveToFirebase();showMsg("hol-msg","✅ Adicionado!","ok");renderConfig();
};

window.removeHoliday=function(h){
  STATE.config.holidays=STATE.config.holidays.filter(x=>x!==h);
  saveToFirebase();renderConfig();
};

// ─── Backup JSON (somente leitura) ──────────────────────────────────────────
// Converte recursivamente Timestamps do Firestore (via .toDate() ou
// {seconds,nanoseconds}) em strings ISO. Neste projeto as datas já são strings
// (YYYY-MM-DD / ISO), então é efetivamente passthrough — mantido por paridade
// com os backups do Mahau-sistema e do Mahau-CRM.
function backupSerialize(v){
  if(v==null)return v;
  if(typeof v.toDate==="function"){ try{ return v.toDate().toISOString(); }catch(e){ return String(v); } }
  if(typeof v==="object"&&typeof v.seconds==="number"&&typeof v.nanoseconds==="number"){
    return new Date(v.seconds*1000+Math.round(v.nanoseconds/1e6)).toISOString();
  }
  if(Array.isArray(v))return v.map(backupSerialize);
  if(typeof v==="object"){ const o={}; for(const k in v)o[k]=backupSerialize(v[k]); return o; }
  return v;
}

// YYYY-MM-DD-HH-mm em horário local.
function backupStamp(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}-${p(d.getMinutes())}`;
}

window.exportBackupJSON=async function(){
  const btn=document.getElementById("backup-btn");
  const orig=btn?btn.textContent:"";
  if(btn){ btn.disabled=true; btn.textContent="⏳ Exportando..."; }
  try{
    // Backup do posto ATIVO. Lê fresco do Firestore (fonte da verdade), não da STATE.
    // REDE DE SEGURANÇA: agrega o meta + TODOS os day-docs do índice numa base
    // consolidada {sales,bank,mdr,config} → reflete a BASE COMPLETA ATUAL (não congela).
    // Somente leitura. Modelo legado removido → sempre modo diário (sv>=2).
    const metaSnap=await getDoc(doc(db,"conciliacao",metaDocId()));
    const meta=metaSnap.exists()?metaSnap.data():null;
    const sv=meta?Number(meta.schemaVersion)||0:0;
    if(!meta||sv<2){ showMsg("backup-msg",`Meta do posto ${activePosto} não encontrado (sv>=2). Backup abortado.`,"err"); return; }
    const dias=Array.isArray(meta.days)?meta.days.map(x=>x.dia).filter(Boolean):[];
    const allSales=[],allBank=[];
    // getDoc dos day-docs em PARALELO; agrega na ordem original de `dias`
    // (semântica idêntica ao loop sequencial, só que sem 1 RTT por dia).
    const daySnaps=await Promise.all(dias.map(dia=>getDoc(doc(db,"conciliacao",dayDocId(dia)))));
    daySnaps.forEach(s=>{
      const dd=s.exists()?backupSerialize(s.data()):{};
      if(Array.isArray(dd.sales)) allSales.push(...dd.sales);
      if(Array.isArray(dd.bank))  allBank.push(...dd.bank);
    });
    const consolidated={sales:allSales,bank:allBank,mdr:backupSerialize(meta.mdr),config:backupSerialize(meta.config)};
    const backup={
      exported_at:new Date().toISOString(),
      project:"conciliacao-posto",
      posto:activePosto,
      version:2,
      mode:"paginated-daily",
      counts:{ documentos:dias.length, dias:dias.length, vendas:allSales.length, extrato:allBank.length },
      // meta (real) + base consolidada sob o id do posto ativo (todos os day-docs).
      collections:{ conciliacao:{ [metaDocId()]:backupSerialize(meta), [activePosto]:consolidated } }
    };

    const json=JSON.stringify(backup,null,2);
    const url=URL.createObjectURL(new Blob([json],{type:"application/json"}));
    const a=document.createElement("a");
    a.href=url;
    a.download=`conciliacao-${activePosto}-backup-${backupStamp()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    const total=backup.counts.vendas+backup.counts.extrato;
    showMsg("backup-msg",`✅ Backup gerado: ${backup.counts.vendas} venda(s) + ${backup.counts.extrato} entrada(s) = ${total} registro(s).`,"ok");
  }catch(e){
    console.error("[exportBackupJSON] falha:",e);
    showMsg("backup-msg","Erro ao gerar backup: "+(e?.message||e),"err");
  }finally{
    if(btn){ btn.disabled=false; btn.textContent=orig; }
  }
};

window.doImport=function(){
  const msgEl=document.getElementById("import-msg");
  function importErr(msg){ msgEl.innerHTML=""; const s=document.createElement("span"); s.className="msg-err"; s.textContent=msg; msgEl.appendChild(s); }
  try{
    const d=JSON.parse(document.getElementById("import-text").value);
    if(typeof d!=="object"||d===null||Array.isArray(d)) throw new Error("formato inválido");
    // Valida TUDO antes de tocar no STATE (atômico): se algo falhar, nada é aplicado.
    let newSales,newBank;
    if(d.sales!==undefined){
      if(!Array.isArray(d.sales)) throw new Error("campo sales inválido");
      if(d.sales.length>50000) throw new Error("muitos registros");
      newSales=d.sales.map((s,i)=>normSale(s,i)); // 2 args (remote=undefined → regenera id). fail-fast: lança no 1º inválido
    }
    if(d.bank!==undefined){
      if(!Array.isArray(d.bank)) throw new Error("campo bank inválido");
      if(d.bank.length>50000) throw new Error("muitos registros");
      newBank=d.bank.map((e,i)=>normBank(e,i)); // 2 args (remote=undefined → regenera id)
    }
    // Tudo validou — agora aplica.
    if(newSales!==undefined) STATE.sales=newSales;
    if(newBank!==undefined) STATE.bank=newBank;
    if(isPlainObject(d.mdr))STATE.mdr=sanitizeMdr({...DEFAULT_MDR,...d.mdr});
    if(isPlainObject(d.config))STATE.config=sanitizeConfig({...DEFAULT_CONFIG,...d.config});
    saveToFirebase();
    document.getElementById("import-text").value="";
    closeModal("import-modal");
    renderCurrentTab();
    alert("✅ Dados importados!");
  }catch(e){ importErr("Texto inválido: "+e.message); }
};

window.closeModal=function(id){document.getElementById(id).style.display="none";};

// ─── Confirmação destrutiva ───────────────────────────────────────────────────
let _confirmCb=null;

window.confirmarLimpar=function(msg,callback){
  _confirmCb=callback;
  document.getElementById("confirm-msg").textContent=msg;
  const inp=document.getElementById("confirm-input");
  inp.value="";
  const btn=document.getElementById("confirm-ok-btn");
  btn.disabled=true; btn.style.opacity=".35"; btn.style.cursor="not-allowed";
  document.getElementById("confirm-modal").style.display="flex";
  setTimeout(()=>inp.focus(),60);
};

window.checkConfirmInput=function(){
  const ok=document.getElementById("confirm-input").value==="LIMPAR";
  const btn=document.getElementById("confirm-ok-btn");
  btn.disabled=!ok;
  btn.style.opacity=ok?"1":".35";
  btn.style.cursor=ok?"pointer":"not-allowed";
};

window.doConfirmAction=function(){
  if(document.getElementById("confirm-input").value!=="LIMPAR") return;
  const cb=_confirmCb;   // captura antes: closeConfirmModal() zera _confirmCb
  closeConfirmModal();
  if(cb) cb();
};

window.closeConfirmModal=function(){
  document.getElementById("confirm-modal").style.display="none";
  _confirmCb=null;
};

// ─── Helpers UI ───────────────────────────────────────────────────────────────
function showMsg(id,text,type){
  const el=document.getElementById(id);
  if(!el)return;
  el.innerHTML="";
  const span=document.createElement("span");
  span.className="msg-"+type;
  span.textContent=text;
  el.appendChild(span);
  setTimeout(()=>{ if(el)el.innerHTML=""; },2500);
}
